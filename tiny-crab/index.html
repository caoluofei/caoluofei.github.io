/* Layout: a soft egg-shaped toy device holding the tank screen, stat chips and candy buttons; tips sit on cards below */
:root{
  --u:clamp(.5px,.0899vw,1px);
  --bg:#fdf1ea; --dot:#f7dccf; --ink:#5a3d45; --muted:#a07f86; --card:#fffaf6; --line:#f0d6cc;
  --shell1:#ffd6e1; --shell2:#ffc4ad; --shellEdge:#e7a0ad; --frame:#fff4ee;
  --accent:#ff8fa3; --track:#f6e3dc;
  --c1:#ffe08a; --c2:#ffb5c8; --c3:#b6e3c6; --c4:#cbbcf2; --c5:#a9d8f2; --c6:#ffc9a3; --btnInk:#4a3038;
  --f-pixel:"TinyCrabPixel",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-pixel);-webkit-font-smoothing:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:28px 28px}
.wrap{max-width:min(1080px,max(360px,calc((100svh - 400px)*1.333 + 60px)));margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--u)*18)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:400;font-size:calc(var(--u)*36);margin:0;display:flex;align-items:center;gap:calc(var(--u)*12)}
h1 .logo{width:calc(var(--u)*48);height:calc(var(--u)*48);image-rendering:pixelated;background:var(--c2);border-radius:14px;box-shadow:0 3px 0 var(--shellEdge)}
.sub{color:var(--muted);font-size:calc(var(--u)*24);line-height:1.5;margin:0}
/* the toy */
.win{position:relative;background:linear-gradient(160deg,var(--shell1),var(--shell2));border-radius:calc(var(--u)*56);padding:calc(var(--u)*22) calc(var(--u)*24) calc(var(--u)*26);
  box-shadow:0 calc(var(--u)*10) 0 var(--shellEdge),inset 0 calc(var(--u)*6) 0 rgba(255,255,255,.45);display:flex;flex-direction:column;gap:calc(var(--u)*16)}
.win::before,.win::after{content:"";position:absolute;width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:rgba(255,255,255,.55);top:calc(var(--u)*26)}
.win::before{left:calc(var(--u)*34)}.win::after{left:calc(var(--u)*58);opacity:.6}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:calc(var(--u)*56) 4px;font-size:calc(var(--u)*24);color:var(--ink);opacity:.7;min-height:calc(var(--u)*30)}
.barR{display:flex;justify-content:flex-end}
.lampsw{position:relative;display:flex;align-items:center;justify-content:space-between;width:calc(var(--u)*92);height:calc(var(--u)*40);padding:0 calc(var(--u)*10);border-radius:999px;
  background:#5d4a66;color:#fff;box-shadow:inset 0 calc(var(--u)*3) 0 rgba(0,0,0,.25),0 2px 0 rgba(255,255,255,.5);transition:background .2s;opacity:1}
.lampsw svg{width:calc(var(--u)*22);height:calc(var(--u)*22);position:relative;z-index:1;transition:opacity .2s}
.lampsw .knob{position:absolute;top:calc(var(--u)*4);left:calc(var(--u)*4);width:calc(var(--u)*32);height:calc(var(--u)*32);border-radius:50%;background:#fff;box-shadow:0 calc(var(--u)*3) 0 rgba(0,0,0,.18);transition:left .18s cubic-bezier(.3,1.4,.6,1)}
.lampsw[aria-pressed="true"]{background:#ffd166;color:#8a5a00}
.lampsw[aria-pressed="true"] .knob{left:calc(100% - var(--u)*36)}
.lampsw .on{opacity:1}.lampsw .off{opacity:.25;color:#fff}
.lampsw[aria-pressed="false"] .on{opacity:.25}.lampsw[aria-pressed="false"] .off{opacity:1}
.pomo{color:var(--btnInk);background:#fff;border-radius:999px;padding:2px calc(var(--u)*14);font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.12);opacity:1}
.screen{background:var(--frame);border-radius:calc(var(--u)*30);padding:calc(var(--u)*10);box-shadow:inset 0 calc(var(--u)*4) 0 rgba(0,0,0,.08)}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:calc(var(--u)*22);overflow:hidden}
canvas#cv{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#4a3038;border:3px solid #f2a7b5;border-radius:16px;padding:calc(var(--u)*8) calc(var(--u)*16);font-size:calc(var(--u)*24);white-space:nowrap;pointer-events:none;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);border:8px solid transparent;border-top-color:#f2a7b5}
.goout{position:absolute;left:calc(var(--u)*14);top:calc(var(--u)*14);background:#fff;border-radius:999px;padding:calc(var(--u)*8) calc(var(--u)*18);font-size:calc(var(--u)*24);box-shadow:0 calc(var(--u)*4) 0 rgba(0,0,0,.2)}
.flash{position:absolute;inset:0;background:rgba(255,90,110,.35);opacity:0;pointer-events:none;transition:opacity .45s ease-out}
.flash.on{opacity:1;transition:none}
.win.shake{animation:shake .38s steps(6)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-6px,3px) rotate(-.6deg)}40%{transform:translate(5px,-4px) rotate(.5deg)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.win.shake{animation:none}}
/* stat chips with segmented meters */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--u)*12)}
@media (max-width:640px){.stats{grid-template-columns:1fr}}
.stat{display:flex;align-items:center;gap:calc(var(--u)*10);background:rgba(255,255,255,.7);color:var(--btnInk);border-radius:999px;padding:calc(var(--u)*8) calc(var(--u)*16) calc(var(--u)*8) calc(var(--u)*10);font-size:calc(var(--u)*24);min-width:0}
.stat .ico{flex:none;width:calc(var(--u)*36);height:calc(var(--u)*36);border-radius:50%;display:grid;place-items:center}
.stat .ico svg{width:calc(var(--u)*24);height:calc(var(--u)*24)}
.stat .lbl{white-space:nowrap}
.meter{flex:1;min-width:calc(var(--u)*40);height:calc(var(--u)*18);background:repeating-linear-gradient(90deg,#f1dcd5 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);border-radius:6px;overflow:hidden}
.meter i{display:block;width:100%;height:100%;clip-path:inset(0 100% 0 0);transition:clip-path .3s steps(4);-webkit-mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%);mask:repeating-linear-gradient(90deg,#000 0 calc(10% - 3px),transparent calc(10% - 3px) 10%)}
#mMood{background:#ff8fa3}#mFood{background:#ffb347}#mGrow{background:#7cc98f}
/* candy buttons */
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:calc(var(--u)*14)}
@media (max-width:760px){.btns{grid-template-columns:repeat(3,1fr)}}
button{font-family:var(--f-pixel);color:var(--btnInk);cursor:pointer;border:0}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cb{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*6);padding:calc(var(--u)*12) 4px calc(var(--u)*10);border-radius:calc(var(--u)*26);font-size:calc(var(--u)*24);
  box-shadow:0 calc(var(--u)*6) 0 rgba(90,50,60,.28),inset 0 calc(var(--u)*4) 0 rgba(255,255,255,.5);transition:transform .06s}
.cb svg{width:calc(var(--u)*36);height:calc(var(--u)*36)}
.cb:active{transform:translateY(calc(var(--u)*5));box-shadow:0 calc(var(--u)*1) 0 rgba(90,50,60,.28),inset 0 calc(var(--u)*4) 0 rgba(255,255,255,.5)}
.cb[aria-pressed="true"]:not(#bSnd){box-shadow:0 calc(var(--u)*2) 0 rgba(90,50,60,.28),inset 0 0 0 3px rgba(255,255,255,.9);transform:translateY(calc(var(--u)*3))}
#bFeed{background:var(--c1)}#bPet{background:var(--c2)}#bSleep{background:var(--c4)}#bFocus{background:var(--c6)}#bDeco{background:var(--c3)}#bSnd{background:var(--c5)}
#bSnd[aria-pressed="false"] svg{opacity:.4}
/* language pill */
.langwrap{display:flex;align-items:center;gap:10px}

(()=>{

const S=6, W=cv.width/S, H=cv.height/S, FLOOR=H-12;
const bubble=document.getElementById('bubble'),stage=document.getElementById('stage');

let st={mood:70,food:60,xp:0,lvl:0,shells:[],items:[],decos:[],pomo:null};

const NEED=[60,120,220,350];
if(!Array.isArray(st.fishF))st.fishF=[0,0];
if(typeof st.coins!=='number')st.coins=0;if(!Array.isArray(st.owned))st.owned=[];

function addXP(n){if(st.lvl<4)st.xp+=n}

  P(-10,-3-gap/2,4,6+gap,C.dark);P(-9,-2-gap/2,3,4+gap,C.shell);
  if(t>80&&t<500){ctx.fillStyle='#fff3c4';[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{for(let i=0;i<3;i++)px(cx+sx*(10+i*2),cy+sy*(5+i),2,1,'#fff3c4')});
    ctx.font=`36px ${css('--f-pixel')}`;ctx.fillStyle='#fff3c4';ctx.fillText(T('snapTxt'),(cx+8)*S,(cy-8)*S)}
  ctx.globalAlpha=1}
function hitFish(p){if(view==='home')return null;return fishes.find(f=>Math.abs(p.x-f.x)<6&&Math.abs(p.y-f.y)<5)}
const fishName=f=>T('fishNames')[f.i],stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
function startGift(f){if(crab.gift||crab.carry||crab.mode==='molt')return;
  if(!st.items.length){say(fishName(f)+' '+stars(fF(f))+'  '+T('noGift'),3000);return}
  crab.home=false;crab.chaseT=0;crab.gift={f,item:st.items.pop(),t:12000};say(pick(T('giftGo')),2000);sfx.chirp();save()}
function giveGift(f){const n=Math.min(5,fF(f)+1);st.fishF[f.i]=n;crab.gift=null;addXP(6);st.mood=Math.min(100,st.mood+8);
  setMode('happy',1600);sfx.sparkle();for(let k=0;k<6;k++)sparks.push({x:f.x-4+Math.random()*8,y:f.y-2,life:1000});
  say((n===2?T('noSteal'):T('friendUp')).replace('{n}',fishName(f))+'  '+stars(n),2600);f.flee=0;newTarget(f);
  setTimeout(()=>{if(n>=3&&Math.random()<.5&&st.items.length<12){st.items.push('rainbow');say(T('retRare').replace('{n}',fishName(f)),2600);sfx.sparkle()}
    else{foods.push({x:Math.max(16,Math.min(W-34,f.x)),y:Math.max(SURF+2,f.y),gold:true});say(T('retSnack').replace('{n}',fishName(f)),2600);sfx.plop()}save()},2800);save()}
function wake(){if(crab.mode==='sleep'){setMode('idle');say(pick(lines.wake));sfx.chirp();return true}return false}
function pet(){crab.blush=1500;sfx.purr();addXP(4);setMode('happy',1600);st.mood=Math.min(100,st.mood+8);
  for(let i=0;i<4;i++)sparks.push({x:crab.x-8+Math.random()*16,y:FLOOR-20,life:900});
  say(pick(lines.pet));save()}

document.querySelector('.btns').addEventListener('pointerdown',()=>sfx.unlock());
let decoMode=false,decoPick=null,dragDeco=null;
const lvLabel=document.getElementById('lvLabel'),palette=document.getElementById('palette');
const D=()=>view==='home'?st.homeDecos:st.decos,setD=a=>{if(view==='home')st.homeDecos=a;else st.decos=a};
function hitDeco(p){for(let i=D().length-1;i>=0;i--){const d=D()[i],s=DECO[d.type];if(Math.abs(p.x-d.x)<=s.w&&p.y>=FLOOR-(s.lift||0)-s.h-1&&p.y<=FLOOR-(s.lift||0)+2)return d}return null}
const selected=new Set();let drag=null;
const dclamp=x=>Math.round(Math.max(6,Math.min(W-6,x)));
function refreshSel(){for(const d of selected)if(!D().includes(d))selected.delete(d);const n=selected.size;
  document.getElementById('selN').textContent=n?'('+n+')':'';document.getElementById('bDel').disabled=!n}
cv.addEventListener('pointerdown',e=>{if(!decoMode)return;sfx.unlock();const p=toLogical(e);cv.setPointerCapture(e.pointerId);
  const d=hitDeco(p);
  if(d){const group=selected.has(d)?[...selected]:[d];drag={d,x0:p.x,moved:false,group:group.map(g=>[g,g.x])};dragDeco=d;return}
  if(decoPick&&D().length<40){const n={type:decoPick,x:dclamp(p.x)};D().push(n);syncWeeds();sfx.place();drag={d:n,x0:p.x,moved:true,group:[[n,n.x]]};dragDeco=n;save()}
  else{selected.clear();refreshSel()}});
cv.addEventListener('pointerdown',e=>{if(view==='arcade'){sfx.unlock();cv.setPointerCapture(e.pointerId);arcDown(toLogical(e));return}if(decoMode)return;sfx.unlock();if(st.ghost){ghostDown(e);return}crab.home=false;lastTouch=performance.now();const p=toLogical(e);down={p,moved:0,dist:0,on:onCrab(p),lastX:p.x};lastP=p;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerleave',()=>{lastP=null});
cv.addEventListener('pointermove',e=>{const p=toLogical(e);if(view==='arcade'){if(e.pointerType==='mouse'||e.buttons)arc.px=p.x;return}if(gdrag&&ghost){ghost.x=Math.max(4,Math.min(W-4,p.x));ghost.y=Math.max(SURF,Math.min(FLOOR-1,p.y+4));return}if(drag){const dx=p.x-drag.x0;if(Math.abs(dx)>.8)drag.moved=true;if(drag.moved){drag.group.forEach(([g,x])=>g.x=dclamp(x+dx));syncWeeds()}return}if(!down)return;down.dist+=Math.abs(p.x-down.p.x)>3?1:0;
  if(down.on&&!down.lift&&down.p.y-p.y>4){down.lift=true;crab.blush=0;crab.chaseT=0;setMode('lift');sfx.yelp();say(pick(T('lift')),99999)}
  if(down.lift){crab.x=Math.max(16,Math.min(W-16,p.x));crab.y=Math.max(5-FLOOR,Math.min(0,p.y+12*sc()-FLOOR));return}
  if(down.on&&onCrab(p)){down.moved+=Math.abs(p.x-down.lastX);down.lastX=p.x;crab.petAcc+=Math.abs(p.x-down.lastX);
    if(down.moved>14){down.moved=0;if(!wake())pet()}}});
cv.addEventListener('pointerup',e=>{if(view==='arcade'){down=null;return}if(gdrag){gdrag=false;ghostDrop();return}if(drag){if(!drag.moved){if(selected.has(drag.d))selected.delete(drag.d);else selected.add(drag.d);sfx.step();refreshSel()}drag=null;dragDeco=null;save();return}if(!down)return;const p=toLogical(e);
  if(down.lift){crab.vy=0;setMode(crab.y<0?'fall':'idle');if(crab.y>=0){crab.tx=crab.x;bubble.hidden=true}down=null;return}
  if(down.on&&down.moved<4){if(!wake()){if(onClaw(down.p)){clawPoke(down.p);down=null;save();return}setMode('wave',1200);say(pick(lines.tap));sfx.click();st.mood=Math.min(100,st.mood+2)}}
  else if(!down.on&&down.dist<3){if(view==='home'&&hitArcade(p)){down=null;openArcade();return}if(view==='home'&&hitDoor(p)){down=null;exitHome();return}if(view==='out'&&hitNest(p)){down=null;enterHome();return}wake();const f=hitFish(p);if(f)startGift(f);else crab.tx=Math.max(view==='home'?34:16,Math.min(W-(view==='home'?16:34),p.x))}
  down=null;save()});

document.getElementById('bFeed').onclick=()=>{if(view==='arcade')return;if(st.ghost){say(T('ghostHint'),2400);return}lastTouch=performance.now();crab.home=false;wake();foods.push({x:Math.max(16,Math.min(W-34,crab.x+(Math.random()*80-40))),y:0})};
document.getElementById('bPet').onclick=()=>{if(view==='arcade')return;if(st.ghost){say(T('ghostHint'),2400);return}lastTouch=performance.now();if(!wake())pet()};
document.getElementById('bSleep').onclick=()=>{if(view==='arcade')return;if(st.ghost){say(T('ghostHint'),2400);return}if(crab.mode==='sleep'){wake();lastTouch=performance.now()}else{crab.home=true;crab.tx=NC;lastTouch=-1e9;say(T('gohome'),1500)}};
function notify(t){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(T('title'),{body:t,icon:'icon-192.png',tag:'crab'})}catch(e){}}
setInterval(()=>{if(focusing()||st.ghost)return;if(crab.mode==='sleep'){setMode('idle')}lastTouch=performance.now();setMode('wave',1500);sfx.click();const t=pick(lines.water);say(t,5000);notify(t)},30*60*1000);
function kegel(){if(focusing()||st.ghost)return;const K=T('kegel');crab.home=false;if(crab.mode==='sleep')setMode('idle');lastTouch=performance.now();
  setMode('wave',1500);sfx.chirp();say(K[0],2600);notify(K[0]);let i=0;
  const step=()=>{if(i>=10){say(T('kegel')[3],2600);setMode('happy',1500);return}
    if(i===9)addXP(5);
    const squeeze=i%2===0;say(T('kegel')[squeeze?1:2],2900);if(squeeze){crab.blush=2900;crab.squeeze=2900;sfx.purr()}else crab.squeeze=0;i++;lastTouch=performance.now();setTimeout(step,3000)};
  setTimeout(step,2800)}
setInterval(kegel,60*60*1000);
const standalone=matchMedia('(display-mode: standalone)').matches;
document.getElementById('installTip').hidden=standalone||!/github\.io$/.test(location.hostname);
cv.addEventListener('pointerdown',()=>{try{if(standalone&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}},{once:true});
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setInterval(save,10000);
const bFocus=document.getElementById('bFocus'),bFocusL=document.getElementById('bFocusL'),pomoEl=document.getElementById('pomo');
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tickPomo(){const P=st.pomo;bFocusL.textContent=T(P?'stop':'focus');bFocus.setAttribute('aria-pressed',!!P);
  if(!P){pomoEl.hidden=true;return}const left=P.end-Date.now();pomoEl.hidden=false;pomoEl.textContent=T(P.phase==='focus'?'focusLabel':'breakLabel')+' '+fmt(left);
  if(left<=0){if(P.phase==='focus'){st.pomo={phase:'break',end:Date.now()+5*60e3};addXP(20);if(crab.mode==='sleep')setMode('idle');setMode('happy',2000);say(T('focusEnd'),6000);notify(T('focusEnd'));sfx.chime()}
    else{st.pomo=null;if(crab.mode==='sleep')setMode('idle');setMode('wave',1500);say(T('breakEnd'),4000);notify(T('breakEnd'));sfx.chime()}lastTouch=performance.now();save()}}
bFocus.onclick=()=>{sfx.unlock();lastTouch=performance.now();if(st.pomo){st.pomo=null;say(T('focusStop'),1800)}else{st.pomo={phase:'focus',end:Date.now()+25*60e3};wake();say(T('focusStart'),2600);sfx.chirp()}save()};
function setDeco(on){decoMode=on;document.querySelectorAll('[data-deco]').forEach(b=>b.hidden=!DECO[b.dataset.deco].home!==(view!=='home'));palette.hidden=!on;document.getElementById('bDeco').setAttribute('aria-pressed',on);if(!on){decoPick=null;dragDeco=null;drag=null;selected.clear();refreshSel()}
  document.querySelectorAll('[data-deco]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.deco===decoPick))}
document.getElementById('bDeco').onclick=()=>{if(view!=='arcade')setDeco(!decoMode)};
document.getElementById('bDone').onclick=()=>{setDeco(false);save()};
document.getElementById('bUndo').onclick=()=>{if(D().pop()){syncWeeds();refreshSel();sfx.place();save()}};
function delSelected(){if(!selected.size)return;setD(D().filter(d=>!selected.has(d)));selected.clear();syncWeeds();refreshSel();sfx.thud();save()}
document.getElementById('bDel').onclick=delSelected;
const bClear=document.getElementById('bClear');let clearArm=null;
bClear.onclick=()=>{if(!D().length)return;
  if(clearArm){clearTimeout(clearArm);clearArm=null;bClear.classList.remove('warn');bClear.textContent=T('clearAll');setD([]);selected.clear();syncWeeds();refreshSel();sfx.thud();save();return}
  bClear.classList.add('warn');bClear.textContent=T('sure');clearArm=setTimeout(()=>{clearArm=null;bClear.classList.remove('warn');bClear.textContent=T('clearAll')},3000)};
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')arc.kl=false;if(e.key==='ArrowRight')arc.kr=false});
addEventListener('keydown',e=>{if(view==='arcade'){if(e.key==='ArrowLeft')arc.kl=true;else if(e.key==='ArrowRight')arc.kr=true;else if(e.key===' '||e.key==='Enter'){e.preventDefault();arcDown(null)}return}if(decoMode&&(e.key==='Delete'||e.key==='Backspace')&&selected.size){e.preventDefault();delSelected()}});
// pixel thumbnails for the tiles, drawn with the same code as the tank
document.querySelectorAll('[data-thumb]').forEach(c=>{const t=c.dataset.thumb,g=c.getContext('2d'),keep=ctx;ctx=g;
  const s=DECO[t],box=Math.max(s.w*2+4,s.h+5),cx=Math.round(box/2)+(t==='wood'?1:0);g.save();const k=c.width/(box*S);g.scale(k,k);g.translate(0,-(FLOOR-(box-2))*S);
  drawDeco({type:t,x:cx,thumb:true});g.restore();c.style.setProperty('--sand',((box-2)/box*100).toFixed(1)+'%');ctx=keep});
let buyArm=null;
function owned(t){return !DECO[t].price||st.owned.includes(t)}
function syncShop(){document.getElementById('coinN').textContent=st.coins;document.getElementById('coinPill').title=T('coins');
  document.querySelectorAll('[data-deco]').forEach(b=>{const t=b.dataset.deco,pr=b.querySelector('.price'),lk=!owned(t);b.classList.toggle('locked',lk);
    if(!pr)return;pr.hidden=!lk;if(lk){const ask=buyArm===t;pr.classList.toggle('ask',ask);pr.textContent=ask?T('buyAsk'):DECO[t].price}})}
document.querySelectorAll('[data-deco]').forEach(b=>b.onclick=()=>{const t=b.dataset.deco;
  if(!owned(t)){if(st.coins<DECO[t].price){buyArm=null;syncShop();say(T('noCoins')+'  '+st.coins+'/'+DECO[t].price,2000);sfx.thud();return}
    if(buyArm!==t){buyArm=t;syncShop();return}st.coins-=DECO[t].price;st.owned.push(t);buyArm=null;sfx.sparkle();syncShop();save()}
  buyArm=null;decoPick=decoPick===t?null:t;setDeco(true);syncShop()});
syncWeeds();
if(st.ghost)initGhost();
syncGo();syncShop();
document.getElementById('bGo').onclick=()=>{sfx.unlock();if(view==='arcade')closeArcade();else exitHome()};
syncLamp();
document.getElementById('bLamp').onclick=()=>{sfx.unlock();const on=!(LT>=.5);st.lamp={on,base:daylight()>=.5};LT=targetL();syncLamp();lastTouch=performance.now();
  if(on){sfx.switchOn();prevNight=false;if(crab.mode==='sleep'){setMode('wave',1200);say(T('lampWake'),2200)}else say(T('lampBright'),1600)}
  else{sfx.switchOff();if(crab.mode!=='sleep'&&crab.mode!=='lift'&&crab.mode!=='fall'&&!crab.carry&&!crab.gift){crab.home=true;crab.tx=NC;say(T('lampDark'),1800)}}
  save()};
(()=>{const c=document.getElementById('logo'),g=c.getContext('2d'),P=(x,y,w,hh,col)=>{g.fillStyle=col;g.fillRect(x*3,y*3,w*3,hh*3)};
  [[5,6],[4,8],[3,10],[3,10],[3,10],[4,8]].forEach(([x,w],i)=>P(x,8+i,w,1,'#e8743b'));P(5,5,1,3,'#b4502a');P(10,5,1,3,'#b4502a');
  P(4,3,3,3,'#fff7ee');P(9,3,3,3,'#fff7ee');P(5,4,2,2,'#2a1d18');P(10,4,2,2,'#2a1d18');P(7,11,2,1,'#2a1d18');P(4,11,2,1,'#ff9b8a');P(10,11,2,1,'#ff9b8a');
  P(1,7,2,3,'#e8743b');P(13,7,2,3,'#e8743b')})();
document.getElementById('bSnd').onclick=e=>{sfx.unlock();const o=sfx.toggle();sndOn=o;document.getElementById('bSndL').textContent=T(o?'sndOn':'sndOff');e.currentTarget.setAttribute('aria-pressed',o)};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  cv.setAttribute('aria-label',T('aria'));document.getElementById('bSndL').textContent=T(sndOn?'sndOn':'sndOff');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));syncLamp();syncGo();syncShop()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('crablang',lang)}catch(e){}applyLang();say(T('hello'),1600)});
applyLang();
say(T('hello'),2600);
requestAnimationFrame(loop);
})();
</script>
