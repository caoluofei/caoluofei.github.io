/* Layout: a soft egg-shaped toy device holding the tank screen, stat chips and candy buttons; tips sit on cards below */
:root {
  --u: clamp(0.5px, 0.0899vw, 1px);
  --bg: #fdf1ea;
  --dot: #f7dccf;
  --ink: #5a3d45;
  --muted: #a07f86;
  --card: #fffaf6;
  --line: #f0d6cc;
  --shell1: #ffd6e1;
  --shell2: #ffc4ad;
  --shellEdge: #e7a0ad;
  --frame: #fff4ee;
  --accent: #ff8fa3;
  --track: #f6e3dc;
  --c1: #ffe08a;
  --c2: #ffb5c8;
  --c3: #b6e3c6;
  --c4: #cbbcf2;
  --c5: #a9d8f2;
  --c6: #ffc9a3;
  --btnInk: #4a3038;
  --f-pixel: "TinyCrabPixel", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #271f2b;
    --dot: #32283a;
    --ink: #f7e6ec;
    --muted: #c3a8b4;
    --card: #30263a;
    --line: #43354d;
    --shell1: #6a4a68;
    --shell2: #5a4570;
    --shellEdge: #3c2c48;
    --frame: #3a2e44;
    --accent: #ff9db0;
    --track: #43354d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #271f2b;
  --dot: #32283a;
  --ink: #f7e6ec;
  --muted: #c3a8b4;
  --card: #30263a;
  --line: #43354d;
  --shell1: #6a4a68;
  --shell2: #5a4570;
  --shellEdge: #3c2c48;
  --frame: #3a2e44;
  --accent: #ff9db0;
  --track: #43354d;
  color-scheme: dark;
}
html,
body {
  background: var(--bg);
  color: var(--ink);
}
body {
  font-family: var(--f-pixel);
  -webkit-font-smoothing: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
}
.wrap {
  max-width: min(1080px, max(360px, calc((100svh - 400px) * 1.333 + 60px)));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 18);
}
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  font-weight: 400;
  font-size: calc(var(--u) * 36);
  margin: 0;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 12);
}
h1 .logo {
  width: calc(var(--u) * 48);
  height: calc(var(--u) * 48);
  image-rendering: pixelated;
  background: var(--c2);
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--shellEdge);
}
.sub {
  color: var(--muted);
  font-size: calc(var(--u) * 24);
  line-height: 1.5;
  margin: 0;
}
/* the toy */
.win {
  position: relative;
  background: linear-gradient(160deg, var(--shell1), var(--shell2));
  border-radius: calc(var(--u) * 56);
  padding: calc(var(--u) * 22) calc(var(--u) * 24) calc(var(--u) * 26);
  box-shadow:
    0 calc(var(--u) * 10) 0 var(--shellEdge),
    inset 0 calc(var(--u) * 6) 0 rgba(255, 255, 255, 0.45);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 16);
}
.win::before,
.win::after {
  content: "";
  position: absolute;
  width: calc(var(--u) * 14);
  height: calc(var(--u) * 14);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  top: calc(var(--u) * 26);
}
.win::before {
  left: calc(var(--u) * 34);
}
.win::after {
  left: calc(var(--u) * 58);
  opacity: 0.6;
}
.bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding-inline: calc(var(--u) * 56) 4px;
  font-size: calc(var(--u) * 24);
  color: var(--ink);
  opacity: 0.7;
  min-height: calc(var(--u) * 30);
}
.barR {
  display: flex;
  justify-content: flex-end;
}
.lampsw {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(var(--u) * 92);
  height: calc(var(--u) * 40);
  padding: 0 calc(var(--u) * 10);
  border-radius: 999px;
  background: #5d4a66;
  color: #fff;
  box-shadow:
    inset 0 calc(var(--u) * 3) 0 rgba(0, 0, 0, 0.25),
    0 2px 0 rgba(255, 255, 255, 0.5);
  transition: background 0.2s;
  opacity: 1;
}
.lampsw svg {
  width: calc(var(--u) * 22);
  height: calc(var(--u) * 22);
  position: relative;
  z-index: 1;
  transition: opacity 0.2s;
}
.lampsw .knob {
  position: absolute;
  top: calc(var(--u) * 4);
  left: calc(var(--u) * 4);
  width: calc(var(--u) * 32);
  height: calc(var(--u) * 32);
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 calc(var(--u) * 3) 0 rgba(0, 0, 0, 0.18);
  transition: left 0.18s cubic-bezier(0.3, 1.4, 0.6, 1);
}
.lampsw[aria-pressed="true"] {
  background: #ffd166;
  color: #8a5a00;
}
.lampsw[aria-pressed="true"] .knob {
  left: calc(100% - var(--u) * 36);
}
.lampsw .on {
  opacity: 1;
}
.lampsw .off {
  opacity: 0.25;
  color: #fff;
}
.lampsw[aria-pressed="false"] .on {
  opacity: 0.25;
}
.lampsw[aria-pressed="false"] .off {
  opacity: 1;
}
.pomo {
  color: var(--btnInk);
  background: #fff;
  border-radius: 999px;
  padding: 2px calc(var(--u) * 14);
  font-variant-numeric: tabular-nums;
  box-shadow: 0 2px 0 rgba(0, 0, 0, 0.12);
  opacity: 1;
}
.screen {
  background: var(--frame);
  border-radius: calc(var(--u) * 30);
  padding: calc(var(--u) * 10);
  box-shadow: inset 0 calc(var(--u) * 4) 0 rgba(0, 0, 0, 0.08);
}
.stage {
  position: relative;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  border-radius: calc(var(--u) * 22);
  overflow: hidden;
}
canvas#cv {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
  cursor: pointer;
}
.bubble {
  position: absolute;
  transform: translate(-50%, -100%);
  background: #fff;
  color: #4a3038;
  border: 3px solid #f2a7b5;
  border-radius: 16px;
  padding: calc(var(--u) * 8) calc(var(--u) * 16);
  font-size: calc(var(--u) * 24);
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.12);
}
.bubble::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -11px;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: #f2a7b5;
}
.goout {
  position: absolute;
  left: calc(var(--u) * 14);
  top: calc(var(--u) * 14);
  background: #fff;
  border-radius: 999px;
  padding: calc(var(--u) * 8) calc(var(--u) * 18);
  font-size: calc(var(--u) * 24);
  box-shadow: 0 calc(var(--u) * 4) 0 rgba(0, 0, 0, 0.2);
}
.flash {
  position: absolute;
  inset: 0;
  background: rgba(255, 90, 110, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.45s ease-out;
}
.flash.on {
  opacity: 1;
  transition: none;
}
.win.shake {
  animation: shake 0.38s steps(6);
}
@keyframes shake {
  0% {
    transform: translate(0, 0);
  }
  20% {
    transform: translate(-6px, 3px) rotate(-0.6deg);
  }
  40% {
    transform: translate(5px, -4px) rotate(0.5deg);
  }
  60% {
    transform: translate(-4px, -2px);
  }
  80% {
    transform: translate(3px, 3px);
  }
  100% {
    transform: translate(0, 0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .win.shake {
    animation: none;
  }
}
/* stat chips with segmented meters */

    if (i >= 0 && i <= W) wv[i] += a * (1 - Math.abs(i - x) / (r + 1));

    drops.push({
      x: x + Math.random() * 18 - 9,
      y: SURF - 1,
      vx: (Math.random() - 0.5) * 0.07,

function physics(dt) {

    for (let i = 0; i <= W; i++) {
      const l = wh[i - 1] ?? wh[i],
        r = wh[i + 1] ?? wh[i];
      wv[i] += 0.22 * (l + r - 2 * wh[i]) - 0.012 * wh[i];
      wv[i] *= 0.985;
    }
    for (let i = 0; i <= W; i++) wh[i] = Math.max(-7, Math.min(7, wh[i] + wv[i]));
  }

    top = bot - 17 * sc(),
    vy = (crab.y - prevCY) / Math.max(dt, 1),
    dx = crab.x - prevCX,
    inW = bot > SURF + 1;
  if (prevIn && !inW) {
    poke(crab.x, 9, -1.6);
    splash(crab.x, 6, 0.8);
    wet = 2600;
    sfx.splash(0.4);
    sfx.bloop();

  if (!prevIn && inW) {
    const p = Math.min(4, 1 + Math.abs(vy) * 25);
    poke(crab.x, 10, p);
    sfx.splash(Math.min(1, p / 4 + 0.25));
    splash(crab.x, 8 + Math.round(p * 3), Math.min(1.6, 0.6 + p * 0.3));
  }

    const d = Math.sign(dx);
    sfx.slosh(Math.min(1, Math.abs(dx) * 0.9));
    poke(crab.x + d * 11, 3, -Math.min(1.2, Math.abs(dx) * 0.7));
    poke(crab.x - d * 11, 3, Math.min(1, Math.abs(dx) * 0.5));
    if (Math.random() < Math.abs(dx) * 0.3) splash(crab.x + d * 11, 1, 0.6);
  }
  if (crab.mode === "lift" && top < SURF + 2 && bot > SURF && Math.abs(vy) > 0.01) {
    poke(crab.x, 8, vy * 6);
    sfx.slosh(Math.min(1, Math.abs(vy) * 25));
  }
  wet = Math.max(0, wet - dt);
  if (wet > 0 && !inW && Math.random() < dt / (90 + (2600 - wet) / 6))
    drops.push({ x: crab.x + Math.random() * 14 - 7, y: bot, vx: 0, vy: 0.01 });
  drops.forEach(d => {
    d.vy += 0.0005 * dt;
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    if (d.vy > 0 && d.y >= surfY(d.x)) {
      poke(d.x, 1, 0.5);
      d.dead = 1;
      sfx.drip();

  const k = dt / 16,
    cbot = FLOOR + crab.y;
  weeds.forEach(w => {
    const d = w.x + 1 - crab.x,
      overlap = cbot > FLOOR - w.h && cbot - 17 < FLOOR;
    if (Math.abs(d) < 13 && overlap) {
      const want = (d >= 0 ? 1 : -1) * (13 - Math.abs(d)) * 1.2;
      w.vel += (want - w.off) * 0.03 * k;
      w.vel += dx * 0.25;
      if (Math.abs(dx) + Math.abs(vy) * 20 > 0.3 && Math.random() < 0.08 * k)
        bubs.push({ x: w.x + w.off * 0.5, y: FLOOR - w.h * 0.5, s: 1, p: Math.random() * 6 });
    }
    w.vel += -w.off * 0.012 * k;
    w.vel *= Math.pow(0.94, k);
    w.off = Math.max(-16, Math.min(16, w.off + w.vel * k));
  });

  prevCY = crab.y;
  prevCX = crab.x;
}

const TOP = { shelf: 18, table: 7, chest: 9, arcade: 18, sofa: 5, rock: 6, brain: 8 };
function stack(list) {
  list.forEach((d, i) => {
    let b = 0;
    if (!DECO[d.type].lift && d.type !== "rug")
      for (let j = 0; j < i; j++) {
        const s = list[j],
          t = TOP[s.type];
        if (t && Math.abs(d.x - s.x) <= DECO[s.type].w - 1) b = Math.max(b, (s._base || 0) + t);
      }
    d._base = b;
  });
}
function riders(list, group) {
  const out = [],
    set = new Set(group);
  let grew = true;
  while (grew) {
    grew = false;
    for (const r of list) {
      if (set.has(r) || !r._base) continue;
      for (const g of set) {
        const t = TOP[g.type];
        if (t && Math.abs(r.x - g.x) <= DECO[g.type].w - 1 && r._base === (g._base || 0) + t) {
          set.add(r);
          out.push(r);
          grew = true;
          break;
        }
      }
    }
  }
  return out;
}

function update(dt) {

      f.vy += 0.0006 * dt;

      f.y += f.vy * dt;

        f.x = W - 16;
        f.vx = -Math.abs(f.vx) * 0.5;
      }
      if (f.x < 36) {
        f.x = 36;
        f.vx = Math.abs(f.vx) * 0.5;
      }
      if (f.y >= FLOOR - 1) {
        f.y = FLOOR - 1;
        if (f.bounce > 0 && f.vy > 0.03) {
          f.vy *= -0.35;
          f.vx *= 0.6;
          f.bounce--;
          sfx.place();
        } else {
          f.arc = 0;
          f.landed = 1;
          sfx.place();
        }
      }
      return;
    }
    if (f.y < FLOOR - 1) {
      const was = f.y;
      f.y = Math.min(FLOOR - 1, f.y + dt / (view === "home" ? 14 : f.y > SURF ? 60 : 18));
      if (view === "home" && f.y >= FLOOR - 1 && !f.landed) {
        f.landed = 1;
        sfx.place();
      }
      if (was < SURF && f.y >= SURF && view !== "home") {
        sfx.plop();
        poke(f.x, 3, 1.2);
        splash(f.x, 3, 0.5);
      }

  sparks.forEach(s => {
    s.y -= dt / 80;
    s.life -= dt;
  });

  if (view === "arcade") {
    arcUpdate(dt);
    return;
  }
  if (
    Math.random() < dt / 60000 &&
    bubble.hidden &&
    !st.ghost &&
    crab.mode !== "sleep" &&

    bClear.textContent = T("clearAll");
  }, 3000);
};
addEventListener("keyup", e => {
  if (e.key === "ArrowLeft") arc.kl = false;
  if (e.key === "ArrowRight") arc.kr = false;
});
addEventListener("keydown", e => {
  if (view === "arcade") {
    if (e.key === "ArrowLeft") arc.kl = true;
    else if (e.key === "ArrowRight") arc.kr = true;
    else if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      arcDown(null);
    }
    return;
  }
  if (decoMode && (e.key === "Delete" || e.key === "Backspace") && selected.size) {
    e.preventDefault();
    delSelected();
  }
});
// pixel thumbnails for the tiles, drawn with the same code as the tank
document.querySelectorAll("[data-thumb]").forEach(c => {
  const t = c.dataset.thumb,
    g = c.getContext("2d"),
    keep = ctx;
  ctx = g;
  const s = DECO[t],
    box = Math.max(s.w * 2 + 4, s.h + 5),
    cx = Math.round(box / 2) + (t === "wood" ? 1 : 0);
  g.save();
  const k = c.width / (box * S);
  g.scale(k, k);
  g.translate(0, -(FLOOR - (box - 2)) * S);
  drawDeco({ type: t, x: cx, thumb: true });
  g.restore();
  c.style.setProperty("--sand", (((box - 2) / box) * 100).toFixed(1) + "%");
  ctx = keep;
});
let buyArm = null;
function owned(t) {
  return !DECO[t].price || st.owned.includes(t);
}
function syncShop() {
  document.getElementById("coinN").textContent = st.coins;
  document.getElementById("coinPill").title = T("coins");
  document.querySelectorAll("[data-deco]").forEach(b => {
    const t = b.dataset.deco,
      pr = b.querySelector(".price"),
      lk = !owned(t);
    b.classList.toggle("locked", lk);
    if (!pr) return;
    pr.hidden = !lk;
    if (lk) {
      const ask = buyArm === t;
      pr.classList.toggle("ask", ask);
      pr.textContent = ask ? T("buyAsk") : DECO[t].price;
    }
  });
}
document.querySelectorAll("[data-deco]").forEach(
  b =>
    (b.onclick = () => {
      const t = b.dataset.deco;
      if (!owned(t)) {
        if (st.coins < DECO[t].price) {
          buyArm = null;
          syncShop();
          say(T("noCoins") + "  " + st.coins + "/" + DECO[t].price, 2000);
          sfx.thud();
          return;
        }
        if (buyArm !== t) {
          buyArm = t;
          syncShop();
          return;
        }
        st.coins -= DECO[t].price;
        st.owned.push(t);
        buyArm = null;
        sfx.sparkle();
        syncShop();
        save();
      }
      buyArm = null;
      decoPick = decoPick === t ? null : t;
      setDeco(true);
      syncShop();
    }),
);
if (st.ghost) initGhost();
syncGo();
syncShop();
document.getElementById("bGo").onclick = () => {
  sfx.unlock();
  if (view === "arcade") closeArcade();
  else exitHome();
};
syncLamp();
document.getElementById("bLamp").onclick = () => {
  sfx.unlock();
  const on = !(LT >= 0.5);
  st.lamp = { on, base: daylight() >= 0.5 };
  LT = targetL();
  syncLamp();
  lastTouch = performance.now();
  if (on) {
    sfx.switchOn();
    prevNight = false;
    if (crab.mode === "sleep") {
      setMode("wave", 1200);
      say(T("lampWake"), 2200);
    } else say(T("lampBright"), 1600);
  } else {
    sfx.switchOff();
    if (
      crab.mode !== "sleep" &&
      crab.mode !== "lift" &&
      crab.mode !== "fall" &&
      !crab.carry &&
      !crab.gift
    ) {
      crab.home = true;
      crab.tx = NC;
      say(T("lampDark"), 1800);
    }
  }
  save();
};
(() => {
  const c = document.getElementById("logo"),
    g = c.getContext("2d"),
    P = (x, y, w, hh, col) => {
      g.fillStyle = col;
      g.fillRect(x * 3, y * 3, w * 3, hh * 3);

  [

  P(5, 4, 2, 2, "#2a1d18");
  P(10, 4, 2, 2, "#2a1d18");
  P(7, 11, 2, 1, "#2a1d18");
  P(4, 11, 2, 1, "#ff9b8a");
  P(10, 11, 2, 1, "#ff9b8a");
  P(1, 7, 2, 3, "#e8743b");
  P(13, 7, 2, 3, "#e8743b");
})();
document.getElementById("bSnd").onclick = e => {
  sfx.unlock();
  const o = sfx.toggle();
  sndOn = o;
  document.getElementById("bSndL").textContent = T(o ? "sndOn" : "sndOff");
  e.currentTarget.setAttribute("aria-pressed", o);
};

function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
  document.querySelectorAll("[data-i18n]").forEach(el => (el.textContent = T(el.dataset.i18n)));
  cv.setAttribute("aria-label", T("aria"));
  document.getElementById("bSndL").textContent = T(sndOn ? "sndOn" : "sndOff");
  document
    .querySelectorAll(".lang button")
    .forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  syncLamp();
  syncGo();
  syncShop();
}
document.querySelectorAll(".lang button").forEach(
  b =>
    (b.onclick = () => {
      lang = b.dataset.lang;
      try {
        localStorage.setItem("crablang", lang);
      } catch (e) {}
      applyLang();
      say(T("hello"), 1600);
    }),
);
applyLang();
say(T("hello"), 2600);
requestAnimationFrame(loop);

function debugPanel() {
  if (document.getElementById("dbg")) return;
  const box = document.createElement("div");
  box.id = "dbg";
  box.innerHTML = `
    <b>调试</b>
    <div><span>贝壳币</span><button data-a="coins+">+50</button><button data-a="coins0">清零</button></div>
    <div><span>饱腹</span><button data-a="food0">0</button><button data-a="food50">50</button><button data-a="food100">100</button></div>
    <div><span>心情</span><button data-a="mood0">0</button><button data-a="mood100">100</button></div>
    <div><span>体重</span><button data-a="w-1">瘦</button><button data-a="w0">正常</button><button data-a="w1">胖</button></div>
    <div><span>成长</span><button data-a="lvl-">−</button><button data-a="lvl+">+</button><button data-a="xp">攒满经验</button></div>
    <div><span>天色</span><button data-a="skyA">自动</button><button data-a="sky1">白天</button><button data-a="sky0">夜晚</button></div>
    <div><span>时间</span><button data-a="away1">离开 1 小时</button><button data-a="away8">离开 8 小时</button></div>
    <div><span>其他</span><button data-a="treasure">冒宝物</button><button data-a="ghost">变幽灵</button></div>
    <div><span>存档</span><button data-a="reset">清空存档</button></div>`;
  document.body.appendChild(box);
  const style = document.createElement("style");
  style.textContent = `#dbg{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;
    background:#1b1530;color:#fff;border-radius:14px;padding:10px 12px;font:13px/1.3 ui-monospace,monospace;display:grid;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
    #dbg div{display:flex;gap:4px;align-items:center}#dbg span{width:4em;color:#c9c0ee}
    #dbg button{font:inherit;color:#1b1530;background:#ffd166;border:0;border-radius:8px;padding:3px 8px;box-shadow:none;cursor:pointer}
    #dbg button.armed{background:#ff7a8a;color:#fff}`;
  document.head.appendChild(style);
  let armed = null;
  box.addEventListener("click", e => {
    const a = e.target.dataset && e.target.dataset.a;
    if (!a) return;
    if (a === "coins+") st.coins += 50;
    if (a === "coins0") st.coins = 0;
    if (a.startsWith("food")) st.food = +a.slice(4);
    if (a.startsWith("mood")) st.mood = +a.slice(4);
    if (a[0] === "w") st.weight = +a.slice(1);
    if (a === "lvl+") st.lvl = Math.min(4, st.lvl + 1);
    if (a === "lvl-") st.lvl = Math.max(0, st.lvl - 1);
    if (a === "xp" && st.lvl < 4) st.xp = NEED[st.lvl];
    if (a.startsWith("sky")) {
      skyOverride = a === "skyA" ? null : +a.slice(3);
      LT = targetL();
      syncLamp();
    }
    if (a.startsWith("away")) st.seen = Date.now() - +a.slice(4) * 3600e3;
    if (a === "treasure") treasureT = 0;
    if (a === "ghost" && !st.ghost) st.food = 0;
    if (a === "reset") {
      if (armed !== e.target) {
        armed = e.target;
        e.target.classList.add("armed");
        e.target.textContent = "再点一次";
        return;
      }
      try {
        localStorage.removeItem("crabpet");
      } catch (err) {}
      location.reload();
      return;
    }
    syncShop();
    save();
  });
}
if (location.hash === "#debug") debugPanel();
