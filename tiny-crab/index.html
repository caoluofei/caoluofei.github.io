[hidden]{display:none!important}
/* Layout: one desk "window" with the pet stage, a slim status strip and three big buttons under it */
:root{
  --u:clamp(.5px,.0899vw,1px); /* 1px at full width, shrinks with the window, never below half */
  --bg:#f3ece4; --panel:#fffaf4; --ink:#3b2a22; --muted:#8a7366; --line:#e3d4c6;
  --accent:#e8743b; --floor:#e9dccd; --wall:#fbf3ea;
  --f-pixel:"FusionPixel",ui-monospace,monospace;
  --f-body:"FusionPixel",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1714; --panel:#26201c; --ink:#f2e6db; --muted:#a8968a; --line:#3a312b;
  --accent:#f08a4f; --floor:#2e2620; --wall:#221c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1714; --panel:#26201c; --ink:#f2e6db; --muted:#a8968a; --line:#3a312b;
  --accent:#f08a4f; --floor:#2e2620; --wall:#221c18; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);-webkit-font-smoothing:none;font-smooth:never;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-pixel);font-weight:400;font-size:calc(var(--u)*36);margin:0}
.sub{color:var(--muted);font-size:calc(var(--u)*24);line-height:1.5;margin:0}
.win{background:var(--panel);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:2px solid var(--line);font-family:var(--f-pixel);font-size:calc(var(--u)*24);color:var(--muted)}
.dot{width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:var(--line)}
.dot:first-child{background:var(--accent)}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:calc(var(--u)*8) calc(var(--u)*14);font-family:var(--f-pixel);font-size:calc(var(--u)*24);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border-top:2px solid var(--line);font-family:var(--f-pixel);font-size:calc(var(--u)*24)}
.stat{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.meter{flex:1;height:calc(var(--u)*16);background:var(--floor);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s}
.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:760px){.btns{grid-template-columns:repeat(3,1fr)}}
.pomo{margin-left:auto;color:var(--ink);background:var(--floor);border-radius:6px;padding:2px 10px;font-variant-numeric:tabular-nums}
.palette{border-top:2px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.palette .hint{margin:0;color:var(--muted);font-size:calc(var(--u)*24)}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.pal button{padding:calc(var(--u)*10) calc(var(--u)*16);box-shadow:0 2px 0 var(--ink)}
.pal button[aria-pressed="true"]{background:var(--accent);color:#fff}
.pal .primary{margin-left:auto;background:var(--ink);color:var(--panel)}
button{font-family:var(--f-pixel);font-size:calc(var(--u)*24);padding:calc(var(--u)*16) calc(var(--u)*8);border-radius:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.flash{position:absolute;inset:0;background:rgba(255,70,50,.38);opacity:0;pointer-events:none;transition:opacity .45s ease-out}
.flash.on{opacity:1;transition:none}
.win.shake{animation:shake .38s steps(6)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.win.shake{animation:none}}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.langwrap{display:flex;align-items:center;gap:10px}
.langlabel{display:inline-flex;align-items:center;gap:calc(var(--u)*8);font-family:var(--f-pixel);font-size:calc(var(--u)*24);color:var(--muted)}
.langlabel svg{display:block;width:calc(var(--u)*24);height:calc(var(--u)*24)}
.lang{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.lang button{box-shadow:none;border:0;border-radius:0;padding:calc(var(--u)*8) calc(var(--u)*14);min-width:calc(var(--u)*56);background:var(--panel)}
.lang button+button{border-left:2px solid var(--ink)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:active{transform:none}
.tip{color:var(--muted);font-size:calc(var(--u)*24);margin:0;line-height:1.7}
</style>

const sfx=(()=>{
  let A=null,M=null,NB=null,on=true;const last={};
  const gate=(k,ms)=>{const n=performance.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true};
  function unlock(){if(A){if(A.state==='suspended')A.resume();return}
    try{A=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    M=A.createGain();M.gain.value=on?.8:0;M.connect(A.destination);
    NB=A.createBuffer(1,A.sampleRate,A.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // aquarium hum: filtered noise loop + slow filter wobble
    const n=A.createBufferSource();n.buffer=NB;n.loop=true;const f=A.createBiquadFilter();f.type='lowpass';f.frequency.value=260;
    const g=A.createGain();g.gain.value=.05;const lfo=A.createOscillator();lfo.frequency.value=.15;const lg=A.createGain();lg.gain.value=80;lfo.connect(lg).connect(f.frequency);
    n.connect(f).connect(g).connect(M);n.start();lfo.start()}
  function tone(f0,f1,dur,type,vol,delay=0){if(!A||!on)return;const t=A.currentTime+delay,o=A.createOscillator(),g=A.createGain();o.type=type;
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(M);o.start(t);o.stop(t+dur+.02)}
  function noise(dur,ft,f0,f1,vol,q=1,delay=0){if(!A||!on)return;const t=A.currentTime+delay,s=A.createBufferSource(),fl=A.createBiquadFilter(),g=A.createGain();
    s.buffer=NB;s.playbackRate.value=.8+Math.random()*.4;fl.type=ft;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl).connect(g).connect(M);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
  return{unlock,
    toggle(){on=!on;if(M)M.gain.value=on?.8:0;return on},
    splash(p){if(!gate('sp',120))return;noise(.3+p*.25,'lowpass',2200,300,.18+p*.25,.7);tone(320,110,.18,'sine',.12*p+.05);noise(.12,'bandpass',4000,2500,.06*p,2,.05)},
    bloop(){tone(380,900,.09,'sine',.08,.06)},
    drip(){if(!gate('dr',45))return;const f=1200+Math.random()*900;tone(f,f*1.8,.05,'sine',.05)},
    pop(){if(Math.random()<.5||!gate('pp',90))return;const f=700+Math.random()*500;tone(f,f*1.6,.05,'sine',.03)},
    step(){noise(.03,'bandpass',2800+Math.random()*800,2000,.025,3)},
    click(){noise(.03,'highpass',3000,2500,.12,1);noise(.03,'highpass',3200,2600,.1,1,.1);noise(.03,'highpass',2900,2400,.09,1,.2)},
    yelp(){tone(600,1100,.12,'square',.035);tone(800,1500,.14,'square',.03,.13)},
    flail(){if(!gate('fl',85))return;noise(.025,'bandpass',2200+Math.random()*1200,1800,.035,4)},
    thud(){tone(150,55,.18,'sine',.22);noise(.12,'lowpass',500,150,.12)},
    munch(){for(let i=0;i<3;i++)noise(.06,'bandpass',900+Math.random()*300,600,.11,2,i*.13)},
    purr(){if(!gate('pu',400))return;tone(240,300,.18,'triangle',.07);tone(300,420,.2,'triangle',.06,.17)},
    chirp(){tone(500,700,.1,'sine',.06);tone(700,600,.12,'sine',.05,.1)},
    snap(){noise(.06,'highpass',5000,3000,.35,1);tone(1000,180,.14,'square',.09);tone(160,50,.2,'sine',.3,.03)},
    plop(){tone(260,720,.11,'sine',.12);noise(.08,'lowpass',1500,400,.06)},
    chime(){[660,880,1320].forEach((f,i)=>tone(f,f*1.01,.5,'sine',.1,i*.18))},
    dig(){if(!gate('dg',140))return;noise(.06,'lowpass',1200,400,.08,1)},
    sparkle(){[1500,2000,2600].forEach((f,i)=>tone(f,f*1.2,.12,'sine',.04,i*.07))},
    place(){tone(200,120,.08,'sine',.12);noise(.05,'lowpass',900,300,.06)},
    crack(){for(let i=0;i<4;i++)noise(.04,'highpass',2500,1800,.1,1,i*.12)}}
})();
function say(t,dur=2200){bubble.textContent=t;bubble.hidden=false;bubT=dur}

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x)*S,Math.round(y)*S,w*S,h*S)}

function drawCrab(){
  const {x,mode,t}=crab, bx=Math.round(x), by=FLOOR;
  const walking=mode==='walk', bob=walking?(Math.floor(t/120)%2):(mode==='sleep'?0:Math.floor(t/600)%2);
  const y0=by+Math.round(crab.y);
  const air=mode==='lift'||mode==='fall';
  const K=sc();ctx.save();ctx.translate(bx*S,y0*S);ctx.scale(K,K);ctx.translate(-bx*S,-y0*S);
  if(mode==='molt')ctx.translate((Math.floor(t/60)%2?1:-1)*S/2,0);
  // legs
  if(air){
    const ph=Math.floor(t/55)%2;
    for(let i=0;i<3;i++){
      const a=(i+ph)%2;
      px(bx-9+i*2-a,y0-4,1,4+a,C.dark); px(bx-9+i*2-a-1,y0+a,1,1,C.dark);
      px(bx+8-i*2+(1-a),y0-4,1,5-a,C.dark); px(bx+8-i*2+(1-a)+1,y0+1-a,1,1,C.dark);
    }
  }else{
  const legPh=walking?Math.floor(t/110)%2:0;
  for(let i=0;i<3;i++){
    const off=(i%2===legPh)?1:0;
    px(bx-9+i*2,y0-4,1,3+off,C.dark); px(bx+8-i*2,y0-4,1,3+(1-off),C.dark);
  }
  }
  // body
  const rows=[[-12,8],[-11,12],[-10,14],[-9,16],[-8,16],[-7,16],[-6,16],[-5,14],[-4,10]];
  const lift=mode==='sleep'||crab.squeeze>0?1:(air?0:bob);
  rows.forEach(([ry,w])=>px(bx-w/2,y0+ry+lift,w,1,C.shell));
  px(bx-4,y0-11+lift,4,1,C.light);px(bx-6,y0-10+lift,2,1,C.light);
  px(bx-5,y0-4+lift,10,1,C.dark);
  // claws
  let wave=0;
  if(mode==='wave')wave=Math.floor(t/140)%2?4:2;
  if(mode==='happy')wave=Math.floor(t/250)%2?2:1;
  if(air)wave=Math.floor(t/70)%2?5:1;
  if(mode==='dig')wave=Math.floor(t/90)%2?-2:1;
  const cy=y0-10+lift;
  [[-1,0],[1,1]].forEach(([s,ph])=>{
    const up=mode==='wave'?(ph?wave:6-wave):mode==='dig'?(ph?wave:-wave):wave;
    const cx=bx+s*11;
    px(cx-(s<0?1:0),cy+2-up+3,2,3,C.shell); // arm
    px(cx-2,cy-2-up,5,4,C.shell);
    px(cx-2,cy-3-up,2,1,C.shell);px(cx+1,cy-3-up,2,1,C.shell);
    px(cx-1,cy-3-up,1,2,'#3f9fb6'); // notch
    px(cx-2,cy+1-up,5,1,C.dark);
  });
  // eyestalks
  const ex=[bx-4,bx+3];
  ex.forEach(e=>{
    px(e,y0-14+lift,1,3,C.dark);
    if(mode==='molt'){px(e-1,y0-16+lift,3,1,C.eye)}
    else if(crab.angerT>0&&crab.anger>=3&&!air&&mode!=='sleep'){if(e<bx){px(e-1,y0-20+lift,2,1,C.eye);px(e+1,y0-19+lift,1,1,C.eye)}else{px(e,y0-20+lift,2,1,C.eye);px(e-1,y0-19+lift,1,1,C.eye)}}
    if(mode==='molt'){}
    else if(air){const s=e<bx?1:-1;px(e-1,y0-17,3,3,C.white);px(e-s,y0-17,1,1,C.eye);px(e,y0-16,1,1,C.eye);px(e-s,y0-15,1,1,C.eye)}
    else if(mode==='sleep'||mode==='happy'){px(e-1,y0-16+lift,3,1,C.eye)}
    else{
      const blink=(Math.floor(t/100)%38===0);
      px(e-1,y0-17+lift,3,blink?1:3,C.white);
      if(!blink)px(e-1+(crab.dir>0?1:0),y0-16+lift,2,2,C.eye);
    }
  });
  // face
  if(crab.blush>0||mode==='happy'){px(bx-6,y0-7+lift,2,1,C.blush);px(bx+4,y0-7+lift,2,1,C.blush)}
  if(air) px(bx-1,y0-7,2,2,C.eye); else if(mode==='eat'&&Math.floor(t/120)%2) px(bx-1,y0-7+lift,2,2,C.eye); else px(bx-1,y0-7+lift,2,1,C.eye);
  // zz
  if(mode==='sleep'){
    ctx.fillStyle=css('--muted');ctx.font=`18px ${css('--f-pixel')}`;
    const k=(t/700)%3;
    ctx.fillText('z',(bx+8)*S,(y0-16-k*2)*S); if(k>1)ctx.fillText('Z',(bx+11)*S,(y0-21)*S);
  }
  if(crab.carry)drawItem(crab.carry,bx,y0-20+lift);
  if(mode==='molt'){ctx.globalAlpha=.35+.25*Math.sin(t/80);rows.forEach(([ry,w])=>px(bx-w/2,y0+ry+lift,w,1,'#fff3e6'));ctx.globalAlpha=1}
  ctx.restore();
  return {x0:bx-14*K,x1:bx+14*K,y0:y0-20*K,y1:y0};
}

  if(!treasure&&st.items.length<12){treasureT-=dt;if(treasureT<=0){treasureT=60000+Math.random()*60000;
    let x;do{x=12+Math.random()*(W-24)}while(Math.abs(x-NC)<20);treasure={x,type:['shell','pearl','key','coin','glass'][Math.floor(Math.random()*5)]}}}
  crab.chaseT=(crab.chaseT||0)-dt;crab.startleCD=(crab.startleCD||0)-dt;
  const night=L<.3;
  if(m==='sleep'){if(prevNight&&!night){prevNight=night;setMode('happy',1800);say(pick(T('morning')),2600);sfx.chirp();lastTouch=performance.now()}prevNight=night;return}
  prevNight=night;
  if(m==='molt'){if(crab.modeT<=0){st.shells.push({x:Math.round(crab.x),lvl:st.lvl});if(st.shells.length>3)st.shells.shift();
      st.xp-=NEED[st.lvl];st.lvl++;if(st.lvl>=3)st.xp=0;crab.tx=clampX(crab.x+(crab.x>W-40?-20:20));setMode('happy',2000);say(T('grown'),2800);sfx.sparkle();
      for(let i=0;i<8;i++)sparks.push({x:crab.x-10+Math.random()*20,y:FLOOR-22,life:1200});save()}return}
  if(m==='dig'){if(Math.random()<dt/40){sand.push({x:crab.x+(Math.random()-.5)*10,y:FLOOR-1,vx:(Math.random()-.5)*.06,vy:-.04-Math.random()*.05,life:900});sfx.dig()}
    if(crab.modeT<=0){if(treasure){crab.carry=treasure.type;treasure=null;say(pick(T('found')));sfx.sparkle()}setMode('idle')}return}
  if((m==='wave'||m==='happy'||m==='eat')&&crab.modeT<=0)setMode('idle');
  if(crab.mode==='idle'&&st.lvl<3&&st.xp>=NEED[st.lvl]&&!crab.carry&&!foods.length){setMode('molt',2600);say(T('molt'),2600);sfx.crack();return}
  if(crab.mode==='idle'||crab.mode==='walk'){
    const landed=foods.find(f=>f.y>=FLOOR-1);
    if(landed)crab.tx=landed.x;
    else if(crab.carry)crab.tx=NC+6;
    else if(crab.chaseT>0&&crab.chase)crab.tx=clampX(crab.chase.x);
    else if(treasure&&!crab.home&&!night)crab.tx=treasure.x;
    const d=crab.tx-crab.x;
    if(Math.abs(d)>0.6){crab.dir=Math.sign(d);crab.x+=crab.dir*dt/(crab.chaseT>0?36:55);crab.mode='walk';const lp=Math.floor(crab.t/110)%2;if(lp!==crab.lp){crab.lp=lp;sfx.step()}}
    else{
      crab.mode='idle';
      if(crab.home&&!landed&&Math.abs(crab.x-NC)<1){crab.home=false;crab.x=NC;setMode('sleep');bubble.hidden=true;return}
      if(landed&&Math.abs(landed.x-crab.x)<3){foods.splice(foods.indexOf(landed),1);st.food=Math.min(100,st.food+25);st.mood=Math.min(100,st.mood+5);addXP(12);setMode('eat',1400);say(pick(lines.eat));sfx.munch()}
      else if(crab.carry&&Math.abs(crab.x-(NC+6))<1.2){st.items.push(crab.carry);crab.carry=null;addXP(8);st.mood=Math.min(100,st.mood+6);say(T('stash'));setMode('happy',1200);sfx.place();save()}
      else if(treasure&&!crab.carry&&!night&&Math.abs(crab.x-treasure.x)<1.2){setMode('dig',1400)}
      else if(!foods.length&&!crab.home&&Math.random()<dt/5000){crab.tx=Math.max(18,Math.min(W-34,crab.x+(Math.random()*60-30)))}
    }
  }
  if(performance.now()-lastTouch>(night?12000:40000)&&!foods.length&&!crab.carry&&crab.mode!=='sleep'&&crab.mode!=='molt'&&!crab.home){crab.home=true;crab.tx=NC;say(night?pick(T('night')):T('sleepy'),1800)}
  if(st.food<15&&Math.random()<dt/20000&&bubble.hidden&&!focusing())say(pick(lines.hungry));
  // chase a fish now and then
  if(crab.mode==='idle'&&!night&&!crab.home&&!crab.carry&&!foods.length&&!treasure&&crab.chaseT<=0&&Math.random()<dt/30000){
    const f=fishes.find(f=>f.y>FLOOR-26);if(f){crab.chase=f;crab.chaseT=3200;say(pick(T('chase')),1800);sfx.chirp()}}
}

function loop(now){
  const dt=Math.min(60,now-last);last=now;
  update(dt);physics(dt);drawScene();box=drawCrab();drawNestFront();drawNight();drawPinch(dt);
  if(bubT>0){bubT-=dt;if(bubT<=0)bubble.hidden=true}
  const r=cv.getBoundingClientRect(),k=r.width/cv.width;
  bubble.style.left=(crab.x*S*k)+'px';bubble.style.top=((FLOOR+crab.y-24*sc())*S*k)+'px';
  document.getElementById('mMood').style.width=st.mood+'%';
  document.getElementById('mFood').style.width=st.food+'%';
  document.getElementById('mGrow').style.width=(st.lvl>=3?100:Math.min(100,st.xp/NEED[st.lvl]*100))+'%';
  lvLabel.textContent=T('growth')+' Lv.'+(st.lvl+1);
  tickPomo();
  requestAnimationFrame(loop);
}

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const onCrab=p=>p.x>=box.x0&&p.x<=box.x1&&p.y>=box.y0-2&&p.y<=box.y1+1;
let down=null,pinch=null,sndOn=true;
function onClaw(p){const y0=FLOOR+crab.y,dx=Math.abs(p.x-crab.x),K=sc();return dx>=7*K&&dx<=16*K&&p.y>=y0-17*K&&p.y<=y0-4*K}
function clawPoke(p){const n0=performance.now();if(n0-crab.lastClaw>4000)crab.clawHits=0;crab.lastClaw=n0;const n=++crab.clawHits;
  crab.anger=n;crab.angerT=4000;
  if(n<5){say(T('poke')[n-1]);setMode('wave',500+n*150);sfx.click();return}
  crab.clawHits=0;crab.anger=5;crab.angerT=2600;setMode('wave',1400);st.mood=Math.min(100,st.mood+10);
  pinch={x:p.x,y:p.y,t:0};sfx.snap();say(T('pinch'),2200);
  const w=document.querySelector('.win'),fl=document.getElementById('flash');
  w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
  fl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove('on')))}
function drawPinch(dt){if(!pinch)return;pinch.t+=dt;const t=pinch.t;if(t>900){pinch=null;return}
  const k=2,cx=Math.round(pinch.x),cy=Math.round(pinch.y);
  const gap=t<90?6-t/30:0;const a=t>600?1-(t-600)/300:1;ctx.globalAlpha=a;
  const P=(x,y,w,h,c)=>px(cx+x*k,cy+y*k,w*k,h*k,c);
  // upper jaw
  P(-7,-4-gap,12,4,C.dark);P(-6,-4-gap,10,3,C.shell);P(-4,-4-gap,4,1,C.light);P(4,-1-gap,2,1,C.dark);
  // lower jaw
  P(-7,1+gap,9,3,C.dark);P(-6,1+gap,7,2,C.shell);P(2,1+gap,2,1,C.dark);
  P(-10,-3-gap/2,4,6+gap,C.dark);P(-9,-2-gap/2,3,4+gap,C.shell);
  if(t>80&&t<500){ctx.fillStyle='#fff3c4';[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{for(let i=0;i<3;i++)px(cx+sx*(10+i*2),cy+sy*(5+i),2,1,'#fff3c4')});
    ctx.font=`36px ${css('--f-pixel')}`;ctx.fillStyle='#fff3c4';ctx.fillText(T('snapTxt'),(cx+8)*S,(cy-8)*S)}
  ctx.globalAlpha=1}
function wake(){if(crab.mode==='sleep'){setMode('idle');say(pick(lines.wake));sfx.chirp();return true}return false}
function pet(){crab.blush=1500;sfx.purr();addXP(4);setMode('happy',1600);st.mood=Math.min(100,st.mood+8);
  for(let i=0;i<4;i++)sparks.push({x:crab.x-8+Math.random()*16,y:FLOOR-20,life:900});
  say(pick(lines.pet));save()}

document.querySelector('.btns').addEventListener('pointerdown',()=>sfx.unlock());
let decoMode=false,decoPick=null,dragDeco=null;
const lvLabel=document.getElementById('lvLabel'),palette=document.getElementById('palette');
function hitDeco(p){for(let i=st.decos.length-1;i>=0;i--){const d=st.decos[i],s=DECO[d.type];if(Math.abs(p.x-d.x)<=s.w&&p.y>=FLOOR-s.h-1&&p.y<=FLOOR+2)return d}return null}
cv.addEventListener('pointerdown',e=>{if(!decoMode)return;sfx.unlock();const p=toLogical(e);cv.setPointerCapture(e.pointerId);
  const d=hitDeco(p);if(d){dragDeco=d;return}
  if(decoPick&&st.decos.length<30){const n={type:decoPick,x:Math.round(Math.max(6,Math.min(W-6,p.x)))};st.decos.push(n);syncWeeds();sfx.place();dragDeco=n;save()}});
cv.addEventListener('pointerdown',e=>{if(decoMode)return;sfx.unlock();crab.home=false;lastTouch=performance.now();const p=toLogical(e);down={p,moved:0,dist:0,on:onCrab(p),lastX:p.x};lastP=p;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerleave',()=>{lastP=null});
cv.addEventListener('pointermove',e=>{const p=toLogical(e);if(dragDeco){dragDeco.x=Math.round(Math.max(6,Math.min(W-6,p.x)));syncWeeds();return}if(!down)return;down.dist+=Math.abs(p.x-down.p.x)>3?1:0;
  if(down.on&&!down.lift&&down.p.y-p.y>4){down.lift=true;crab.blush=0;crab.chaseT=0;setMode('lift');sfx.yelp();say(pick(T('lift')),99999)}
  if(down.lift){crab.x=Math.max(16,Math.min(W-16,p.x));crab.y=Math.max(5-FLOOR,Math.min(0,p.y+12*sc()-FLOOR));return}
  if(down.on&&onCrab(p)){down.moved+=Math.abs(p.x-down.lastX);down.lastX=p.x;crab.petAcc+=Math.abs(p.x-down.lastX);
    if(down.moved>14){down.moved=0;if(!wake())pet()}}});
cv.addEventListener('pointerup',e=>{if(dragDeco){dragDeco=null;save();return}if(!down)return;const p=toLogical(e);
  if(down.lift){crab.vy=0;setMode(crab.y<0?'fall':'idle');if(crab.y>=0){crab.tx=crab.x;bubble.hidden=true}down=null;return}
  if(down.on&&down.moved<4){if(!wake()){if(onClaw(down.p)){clawPoke(down.p);down=null;save();return}setMode('wave',1200);say(pick(lines.tap));sfx.click();st.mood=Math.min(100,st.mood+2)}}
  else if(!down.on&&down.dist<3){wake();crab.tx=Math.max(16,Math.min(W-34,p.x))}
  down=null;save()});

document.getElementById('bFeed').onclick=()=>{lastTouch=performance.now();crab.home=false;wake();foods.push({x:Math.max(16,Math.min(W-34,crab.x+(Math.random()*80-40))),y:0})};
document.getElementById('bPet').onclick=()=>{lastTouch=performance.now();if(!wake())pet()};
document.getElementById('bSleep').onclick=()=>{if(crab.mode==='sleep'){wake();lastTouch=performance.now()}else{crab.home=true;crab.tx=NC;lastTouch=-1e9;say(T('gohome'),1500)}};
function notify(t){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(T('title'),{body:t,icon:'icon-192.png',tag:'crab'})}catch(e){}}
setInterval(()=>{if(focusing())return;if(crab.mode==='sleep'){setMode('idle')}lastTouch=performance.now();setMode('wave',1500);sfx.click();const t=pick(lines.water);say(t,5000);notify(t)},30*60*1000);
function kegel(){if(focusing())return;const K=T('kegel');crab.home=false;if(crab.mode==='sleep')setMode('idle');lastTouch=performance.now();
  setMode('wave',1500);sfx.chirp();say(K[0],2600);notify(K[0]);let i=0;
  const step=()=>{if(i>=10){say(T('kegel')[3],2600);setMode('happy',1500);return}
    if(i===9)addXP(5);
    const squeeze=i%2===0;say(T('kegel')[squeeze?1:2],2900);if(squeeze){crab.blush=2900;crab.squeeze=2900;sfx.purr()}else crab.squeeze=0;i++;lastTouch=performance.now();setTimeout(step,3000)};
  setTimeout(step,2800)}
setInterval(kegel,60*60*1000);
const standalone=matchMedia('(display-mode: standalone)').matches;
document.getElementById('installTip').hidden=standalone;
cv.addEventListener('pointerdown',()=>{try{if(standalone&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}},{once:true});
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setInterval(save,10000);
const bFocus=document.getElementById('bFocus'),pomoEl=document.getElementById('pomo');
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tickPomo(){const P=st.pomo;bFocus.textContent=T(P?'stop':'focus');bFocus.setAttribute('aria-pressed',!!P);
  if(!P){pomoEl.hidden=true;return}const left=P.end-Date.now();pomoEl.hidden=false;pomoEl.textContent=T(P.phase==='focus'?'focusLabel':'breakLabel')+' '+fmt(left);
  if(left<=0){if(P.phase==='focus'){st.pomo={phase:'break',end:Date.now()+5*60e3};addXP(20);if(crab.mode==='sleep')setMode('idle');setMode('happy',2000);say(T('focusEnd'),6000);notify(T('focusEnd'));sfx.chime()}
    else{st.pomo=null;if(crab.mode==='sleep')setMode('idle');setMode('wave',1500);say(T('breakEnd'),4000);notify(T('breakEnd'));sfx.chime()}lastTouch=performance.now();save()}}
bFocus.onclick=()=>{sfx.unlock();lastTouch=performance.now();if(st.pomo){st.pomo=null;say(T('focusStop'),1800)}else{st.pomo={phase:'focus',end:Date.now()+25*60e3};wake();say(T('focusStart'),2600);sfx.chirp()}save()};
function setDeco(on){decoMode=on;palette.hidden=!on;document.getElementById('bDeco').setAttribute('aria-pressed',on);if(!on){decoPick=null;dragDeco=null}
  document.querySelectorAll('[data-deco]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.deco===decoPick))}
document.getElementById('bDeco').onclick=()=>setDeco(!decoMode);
document.getElementById('bDone').onclick=()=>{setDeco(false);save()};
document.getElementById('bUndo').onclick=()=>{if(st.decos.pop()){syncWeeds();sfx.place();save()}};
document.querySelectorAll('[data-deco]').forEach(b=>b.onclick=()=>{decoPick=decoPick===b.dataset.deco?null:b.dataset.deco;setDeco(true)});
syncWeeds();
document.getElementById('bSnd').onclick=e=>{sfx.unlock();const o=sfx.toggle();sndOn=o;e.currentTarget.textContent=T(o?'sndOn':'sndOff');e.currentTarget.setAttribute('aria-pressed',o)};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  cv.setAttribute('aria-label',T('aria'));document.getElementById('bSnd').textContent=T(sndOn?'sndOn':'sndOff');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('crablang',lang)}catch(e){}applyLang();say(T('hello'),1600)});
applyLang();
say(T('hello'),2600);
requestAnimationFrame(loop);
})();
</script>
