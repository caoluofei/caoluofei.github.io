/* Layout: a soft egg-shaped toy device holding the tank screen, stat chips and candy buttons; tips sit on cards below */
:root{
  --u:clamp(.5px,.0899vw,1px);
  --bg:#fdf1ea; --dot:#f7dccf; --ink:#5a3d45; --muted:#a07f86; --card:#fffaf6; --line:#f0d6cc;
  --shell1:#ffd6e1; --shell2:#ffc4ad; --shellEdge:#e7a0ad; --frame:#fff4ee;
  --accent:#ff8fa3; --track:#f6e3dc;
  --c1:#ffe08a; --c2:#ffb5c8; --c3:#b6e3c6; --c4:#cbbcf2; --c5:#a9d8f2; --c6:#ffc9a3; --btnInk:#4a3038;
  --f-pixel:"TinyCrabPixel",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-pixel);-webkit-font-smoothing:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:28px 28px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--u)*18)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:400;font-size:calc(var(--u)*36);margin:0;display:flex;align-items:center;gap:calc(var(--u)*12)}
h1 .logo{width:calc(var(--u)*48);height:calc(var(--u)*48);image-rendering:pixelated;background:var(--c2);border-radius:14px;box-shadow:0 3px 0 var(--shellEdge)}
.sub{color:var(--muted);font-size:calc(var(--u)*24);line-height:1.5;margin:0}
/* the toy */
.win{position:relative;background:linear-gradient(160deg,var(--shell1),var(--shell2));border-radius:calc(var(--u)*56);padding:calc(var(--u)*22) calc(var(--u)*24) calc(var(--u)*26);
  box-shadow:0 calc(var(--u)*10) 0 var(--shellEdge),inset 0 calc(var(--u)*6) 0 rgba(255,255,255,.45);display:flex;flex-direction:column;gap:calc(var(--u)*16)}
.win::before,.win::after{content:"";position:absolute;width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:rgba(255,255,255,.55);top:calc(var(--u)*26)}
.win::before{left:calc(var(--u)*34)}.win::after{left:calc(var(--u)*58);opacity:.6}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:calc(var(--u)*56) 4px;font-size:calc(var(--u)*24);color:var(--ink);opacity:.7;min-height:calc(var(--u)*30)}
.barR{display:flex;justify-content:flex-end}
