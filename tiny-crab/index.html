/* Layout: one desk "window" with the pet stage, a slim status strip and three big buttons under it */
:root{
  --u:clamp(.5px,.0899vw,1px); /* 1px at full width, shrinks with the window, never below half */
  --bg:#f3ece4; --panel:#fffaf4; --ink:#3b2a22; --muted:#8a7366; --line:#e3d4c6;
  --accent:#e8743b; --floor:#e9dccd; --wall:#fbf3ea;
  --f-pixel:"FusionPixel",ui-monospace,monospace;
  --f-body:"FusionPixel",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1714; --panel:#26201c; --ink:#f2e6db; --muted:#a8968a; --line:#3a312b;
  --accent:#f08a4f; --floor:#2e2620; --wall:#221c18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1714; --panel:#26201c; --ink:#f2e6db; --muted:#a8968a; --line:#3a312b;
  --accent:#f08a4f; --floor:#2e2620; --wall:#221c18; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);-webkit-font-smoothing:none;font-smooth:never;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-pixel);font-weight:400;font-size:calc(var(--u)*36);margin:0}
.sub{color:var(--muted);font-size:calc(var(--u)*24);line-height:1.5;margin:0}
.win{background:var(--panel);border:2px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:2px solid var(--line);font-family:var(--f-pixel);font-size:calc(var(--u)*24);color:var(--muted)}
.dot{width:calc(var(--u)*14);height:calc(var(--u)*14);border-radius:50%;background:var(--line)}
.dot:first-child{background:var(--accent)}
.stage{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--panel);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:calc(var(--u)*8) calc(var(--u)*14);font-family:var(--f-pixel);font-size:calc(var(--u)*24);white-space:nowrap;pointer-events:none;transition:opacity .2s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap;padding:10px 12px;border-top:2px solid var(--line);font-family:var(--f-pixel);font-size:calc(var(--u)*24)}
.stat{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
.meter{flex:1;height:calc(var(--u)*16);background:var(--floor);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{font-family:var(--f-pixel);font-size:calc(var(--u)*24);padding:calc(var(--u)*16) calc(var(--u)*8);border-radius:8px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.flash{position:absolute;inset:0;background:rgba(255,70,50,.38);opacity:0;pointer-events:none;transition:opacity .45s ease-out}
.flash.on{opacity:1;transition:none}
.win.shake{animation:shake .38s steps(6)}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.win.shake{animation:none}}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.langwrap{display:flex;align-items:center;gap:10px}
.langlabel{display:inline-flex;align-items:center;gap:calc(var(--u)*8);font-family:var(--f-pixel);font-size:calc(var(--u)*24);color:var(--muted)}
.langlabel svg{display:block;width:calc(var(--u)*24);height:calc(var(--u)*24)}
.lang{display:flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.lang button{box-shadow:none;border:0;border-radius:0;padding:calc(var(--u)*8) calc(var(--u)*14);min-width:calc(var(--u)*56);background:var(--panel)}
.lang button+button{border-left:2px solid var(--ink)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.lang button:active{transform:none}
.tip{color:var(--muted);font-size:calc(var(--u)*24);margin:0;line-height:1.7}
</style>

      if(Math.abs(dx)+Math.abs(vy)*20>.3&&Math.random()<.08*k)bubs.push({x:w.x+w.off*.5,y:FLOOR-w.h*.5,s:1,p:Math.random()*6})}
    w.vel+=-w.off*.012*k;w.vel*=Math.pow(.94,k);w.off=Math.max(-16,Math.min(16,w.off+w.vel*k));
  });
  prevIn=inW;prevCY=crab.y;prevCX=crab.x;
}
// stir the seaweed with a finger or the mouse
let lastP=null;
function stir(p){if(lastP&&!(down&&(down.on||down.lift))){const vx=p.x-lastP.x;
  weeds.forEach(w=>{const tipY=FLOOR-w.h;if(Math.abs(p.x-(w.x+w.off*.6))<6&&p.y>tipY-2&&p.y<FLOOR){w.vel+=vx*.35;
    if(Math.abs(vx)>.8&&Math.random()<.25)bubs.push({x:p.x,y:p.y,s:Math.random()<.4?2:1,p:Math.random()*6})}});
  if(p.y>SURF&&p.y<FLOOR&&Math.abs(vx)>.5&&Math.abs(p.y-SURF)<4)poke(p.x,2,vx*.2)}
  lastP=p}
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5;return s-Math.floor(s)};
function drawScene(){
  const T=performance.now();
  // air gap + lamp
  // air gap + lamp
  const ag=ctx.createLinearGradient(0,0,0,SURF*S);ag.addColorStop(0,'#2a3138');ag.addColorStop(1,'#1b252d');
  ctx.fillStyle=ag;ctx.fillRect(0,0,cv.width,FLOOR*S);
  px(0,0,W,2,'#2b2f36');px(4,2,W-8,1,'#fff6d8');
  ctx.fillStyle='rgba(255,246,216,.07)';ctx.fillRect(0,3*S,cv.width,4*S);
  px(3,4,1,SURF-6,'rgba(255,255,255,.12)');
  // water body with live surface
  const g=ctx.createLinearGradient(0,SURF*S,0,FLOOR*S);g.addColorStop(0,'#7fd3dc');g.addColorStop(.5,'#3f9fb6');g.addColorStop(1,'#256f8f');
  ctx.fillStyle=g;
  const sy=[];
  for(let x=0;x<W;x++){const amb=Math.sin(x*.18+T*.003)*.5+Math.sin(x*.07-T*.002)*.4;sy[x]=Math.round(SURF+wh[x]+amb);ctx.fillRect(x*S,sy[x]*S,S,(FLOOR-sy[x])*S)}
  for(let x=0;x<W;x++){px(x,sy[x],1,1,'#d6f7f5');const sl=Math.abs((sy[x+1]??sy[x])-sy[x]);if(sl>0)px(x,sy[x]+1,1,1,'#b4ecee')}
  // droplets
  drops.forEach(d=>{px(d.x,d.y,1,1,'#d6f7f5');if(d.vy>.08)px(d.x,d.y-1,1,1,'rgba(214,247,245,.5)')});
  // light rays from the lamp
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<6;i++){const x0=(i*34+12+Math.sin(T*.0004+i)*6)*S;const a=.05+.035*Math.sin(T*.0011+i*1.9);
    ctx.fillStyle=`rgba(255,250,220,${Math.max(0,a)})`;ctx.beginPath();ctx.moveTo(x0,SURF*S);ctx.lineTo(x0+10*S,SURF*S);ctx.lineTo(x0+22*S,FLOOR*S);ctx.lineTo(x0+6*S,FLOOR*S);ctx.fill()}
  ctx.restore();
  // sand
  px(0,FLOOR,W,H-FLOOR,'#d9c08f');
  for(let x=0;x<W;x+=2)for(let y=FLOOR+1;y<H;y+=2){const h=hash(x,y);if(h>.8)px(x+(h>.9?1:0),y,1,1,'#bfa274');else if(h<.08)px(x,y,1,1,'#efdcb0')}
  // caustics on the sand
  for(let x=0;x<W;x++){const c=Math.sin(x*.31+T*.0021)+Math.sin(x*.13-T*.0017)+Math.sin(x*.07+T*.0009);if(c>1.6)px(x,FLOOR+1+((x*7)%3),1,1,'#fff4cc');if(c>2.1)px(x,FLOOR,1,1,'#fff8de')}
  // rocks
  px(60,FLOOR-4,10,4,'#7d8a92');px(62,FLOOR-6,6,2,'#7d8a92');px(63,FLOOR-6,3,1,'#a3b0b6');px(150,FLOOR-3,7,3,'#6b7780');px(151,FLOOR-4,4,1,'#8f9ba3');
  drawNestBack();
  // seaweed
  weeds.forEach(w=>{let x=w.x;for(let i=0;i<w.h;i++){const f=i/w.h;const sway=Math.sin(T*.0016+w.p+i*.22)*f*4+w.off*Math.pow(f,1.4);const xx=Math.round(w.x+sway);px(xx,FLOOR-i,2,1,w.c);
    if(i%5===3)px(xx+((i%10===3)?2:-2),FLOOR-i,2,1,w.c);if(i%5===4)px(xx+((i%10===4)?3:-3),FLOOR-i,1,1,w.c)}});
  // bubbles
  if(Math.random()<.04)bubs.push({x:weeds[Math.floor(Math.random()*weeds.length)].x+Math.random()*4,y:FLOOR-4,s:Math.random()<.3?2:1,p:Math.random()*6});
  bubs.forEach(b=>{b.y-=.12+b.s*.04;const bx=b.x+Math.sin(b.y*.3+b.p)*1.2;px(bx,b.y,b.s,b.s,'rgba(230,252,255,.75)');if(b.s>1)px(bx,b.y,1,1,'#ffffff')});
  bubs.forEach(b=>{if(b.y<=SURF+1)sfx.pop()});
  bubs=bubs.filter(b=>b.y>SURF+1);
  foods.forEach(f=>{px(f.x-2,f.y-2,4,3,'#f4c95d');px(f.x-1,f.y-3,2,1,'#f9df9a');px(f.x+2,f.y-2,1,2,'#e0a93a')});
  sparks.forEach(s=>{const a=Math.max(0,s.life/900);ctx.globalAlpha=a;px(s.x,s.y,1,1,C.blush);px(s.x-1,s.y,1,1,C.blush);px(s.x+1,s.y,1,1,C.blush);px(s.x,s.y-1,1,1,C.blush);ctx.globalAlpha=1});
}

let box={x0:0,x1:0,y0:0,y1:0};
function update(dt){
  crab.t+=dt;crab.modeT-=dt;crab.angerT-=dt;crab.squeeze=Math.max(0,(crab.squeeze||0)-dt);crab.blush=Math.max(0,crab.blush-dt);
  st.food=Math.max(0,st.food-dt/9000);st.mood=Math.max(0,st.mood-dt/12000);
  // food falling
  foods.forEach(f=>{if(f.y<FLOOR-1){const was=f.y;f.y=Math.min(FLOOR-1,f.y+dt/(f.y>SURF?60:18));if(was<SURF&&f.y>=SURF){sfx.plop();poke(f.x,3,1.2);splash(f.x,3,.5)}}});
  sparks.forEach(s=>{s.y-=dt/80;s.life-=dt});sparks=sparks.filter(s=>s.life>0);

  const m=crab.mode;
  if(m==='lift'){sfx.flail();return}
  if(m==='fall'){crab.vy+=dt*0.0012;if(FLOOR+crab.y>SURF+4)crab.vy=Math.min(crab.vy,.05);crab.y+=crab.vy*dt;
    if(crab.y>=0){crab.y=0;crab.tx=crab.x;setMode('idle');sfx.thud();say(pick(T('land')));lastTouch=performance.now()}
    return}
  if(m==='sleep'){ if(crab.modeT<=0&&crab.modeT>-1e9&&crab.manualSleep===false){} return }
  if((m==='wave'||m==='happy'||m==='eat')&&crab.modeT<=0)setMode('idle');
  if(crab.mode==='idle'||crab.mode==='walk'){
    const landed=foods.find(f=>f.y>=FLOOR-1);
    if(landed)crab.tx=landed.x;
    const d=crab.tx-crab.x;
    if(Math.abs(d)>0.6){crab.dir=Math.sign(d);crab.x+=crab.dir*dt/55;crab.mode='walk';const lp=Math.floor(crab.t/110)%2;if(lp!==crab.lp){crab.lp=lp;sfx.step()}}
    else{
      crab.mode='idle';
      if(crab.home&&!landed&&Math.abs(crab.x-NC)<1){crab.home=false;crab.x=NC;setMode('sleep');bubble.hidden=true;return}
      if(landed&&Math.abs(landed.x-crab.x)<3){foods.splice(foods.indexOf(landed),1);st.food=Math.min(100,st.food+25);st.mood=Math.min(100,st.mood+5);setMode('eat',1400);say(pick(lines.eat));sfx.munch()}
      else if(!foods.length&&!crab.home&&Math.random()<dt/5000){crab.tx=Math.max(18,Math.min(W-34,crab.x+(Math.random()*60-30)))}
    }
  }
  if(performance.now()-lastTouch>40000&&!foods.length&&crab.mode!=='sleep'&&!crab.home){crab.home=true;crab.tx=NC;say(T('sleepy'),1800)}
  if(st.food<15&&Math.random()<dt/20000&&bubble.hidden)say(pick(lines.hungry));
}

function loop(now){
  const dt=Math.min(60,now-last);last=now;
  update(dt);physics(dt);drawScene();box=drawCrab();drawNestFront();drawPinch(dt);
  if(bubT>0){bubT-=dt;if(bubT<=0)bubble.hidden=true}
  const r=cv.getBoundingClientRect(),k=r.width/cv.width;
  bubble.style.left=(crab.x*S*k)+'px';bubble.style.top=((FLOOR+crab.y-24)*S*k)+'px';
  document.getElementById('mMood').style.width=st.mood+'%';
  document.getElementById('mFood').style.width=st.food+'%';
  requestAnimationFrame(loop);
}

function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
const onCrab=p=>p.x>=box.x0&&p.x<=box.x1&&p.y>=box.y0-2&&p.y<=box.y1+1;
let down=null,pinch=null,sndOn=true;
function onClaw(p){const y0=FLOOR+crab.y,dx=Math.abs(p.x-crab.x);return dx>=7&&dx<=16&&p.y>=y0-17&&p.y<=y0-4}
function clawPoke(p){const n0=performance.now();if(n0-crab.lastClaw>4000)crab.clawHits=0;crab.lastClaw=n0;const n=++crab.clawHits;
  crab.anger=n;crab.angerT=4000;
  if(n<5){say(T('poke')[n-1]);setMode('wave',500+n*150);sfx.click();return}
  crab.clawHits=0;crab.anger=5;crab.angerT=2600;setMode('wave',1400);st.mood=Math.min(100,st.mood+10);
  pinch={x:p.x,y:p.y,t:0};sfx.snap();say(T('pinch'),2200);
  const w=document.querySelector('.win'),fl=document.getElementById('flash');
  w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
  fl.classList.add('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.remove('on')))}
function drawPinch(dt){if(!pinch)return;pinch.t+=dt;const t=pinch.t;if(t>900){pinch=null;return}
  const k=2,cx=Math.round(pinch.x),cy=Math.round(pinch.y);
  const gap=t<90?6-t/30:0;const a=t>600?1-(t-600)/300:1;ctx.globalAlpha=a;
  const P=(x,y,w,h,c)=>px(cx+x*k,cy+y*k,w*k,h*k,c);
  // upper jaw
  P(-7,-4-gap,12,4,C.dark);P(-6,-4-gap,10,3,C.shell);P(-4,-4-gap,4,1,C.light);P(4,-1-gap,2,1,C.dark);
  // lower jaw
  P(-7,1+gap,9,3,C.dark);P(-6,1+gap,7,2,C.shell);P(2,1+gap,2,1,C.dark);
  P(-10,-3-gap/2,4,6+gap,C.dark);P(-9,-2-gap/2,3,4+gap,C.shell);
  if(t>80&&t<500){ctx.fillStyle='#fff3c4';[[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sy])=>{for(let i=0;i<3;i++)px(cx+sx*(10+i*2),cy+sy*(5+i),2,1,'#fff3c4')});
    ctx.font=`36px ${css('--f-pixel')}`;ctx.fillStyle='#fff3c4';ctx.fillText(T('snapTxt'),(cx+8)*S,(cy-8)*S)}
  ctx.globalAlpha=1}
function wake(){if(crab.mode==='sleep'){setMode('idle');say(pick(lines.wake));sfx.chirp();return true}return false}
function pet(){crab.blush=1500;sfx.purr();setMode('happy',1600);st.mood=Math.min(100,st.mood+8);
  for(let i=0;i<4;i++)sparks.push({x:crab.x-8+Math.random()*16,y:FLOOR-20,life:900});
  say(pick(lines.pet));save()}

document.querySelector('.btns').addEventListener('pointerdown',()=>sfx.unlock());
cv.addEventListener('pointerdown',e=>{sfx.unlock();crab.home=false;lastTouch=performance.now();const p=toLogical(e);down={p,moved:0,dist:0,on:onCrab(p),lastX:p.x};lastP=p;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerleave',()=>{lastP=null});
cv.addEventListener('pointermove',e=>{const p=toLogical(e);if(!down)return;down.dist+=Math.abs(p.x-down.p.x)>3?1:0;
  if(down.on&&!down.lift&&down.p.y-p.y>4){down.lift=true;crab.blush=0;setMode('lift');sfx.yelp();say(pick(T('lift')),99999)}
  if(down.lift){crab.x=Math.max(16,Math.min(W-16,p.x));crab.y=Math.max(5-FLOOR,Math.min(0,p.y+12-FLOOR));return}
  if(down.on&&onCrab(p)){down.moved+=Math.abs(p.x-down.lastX);down.lastX=p.x;crab.petAcc+=Math.abs(p.x-down.lastX);
    if(down.moved>14){down.moved=0;if(!wake())pet()}}});
cv.addEventListener('pointerup',e=>{if(!down)return;const p=toLogical(e);
  if(down.lift){crab.vy=0;setMode(crab.y<0?'fall':'idle');if(crab.y>=0){crab.tx=crab.x;bubble.hidden=true}down=null;return}
  if(down.on&&down.moved<4){if(!wake()){if(onClaw(down.p)){clawPoke(down.p);down=null;save();return}setMode('wave',1200);say(pick(lines.tap));sfx.click();st.mood=Math.min(100,st.mood+2)}}
  else if(!down.on&&down.dist<3){wake();crab.tx=Math.max(16,Math.min(W-34,p.x))}
  down=null;save()});

document.getElementById('bFeed').onclick=()=>{lastTouch=performance.now();crab.home=false;wake();foods.push({x:Math.max(16,Math.min(W-34,crab.x+(Math.random()*80-40))),y:0})};
document.getElementById('bPet').onclick=()=>{lastTouch=performance.now();if(!wake())pet()};
document.getElementById('bSleep').onclick=()=>{if(crab.mode==='sleep'){wake();lastTouch=performance.now()}else{crab.home=true;crab.tx=NC;lastTouch=-1e9;say(T('gohome'),1500)}};
function notify(t){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(T('title'),{body:t,icon:'icon-192.png',tag:'crab'})}catch(e){}}
setInterval(()=>{if(crab.mode==='sleep'){setMode('idle')}lastTouch=performance.now();setMode('wave',1500);sfx.click();const t=pick(lines.water);say(t,5000);notify(t)},30*60*1000);
function kegel(){const K=T('kegel');crab.home=false;if(crab.mode==='sleep')setMode('idle');lastTouch=performance.now();
  setMode('wave',1500);sfx.chirp();say(K[0],2600);notify(K[0]);let i=0;
  const step=()=>{if(i>=10){say(T('kegel')[3],2600);setMode('happy',1500);return}
    const squeeze=i%2===0;say(T('kegel')[squeeze?1:2],2900);if(squeeze){crab.blush=2900;crab.squeeze=2900;sfx.purr()}else crab.squeeze=0;i++;lastTouch=performance.now();setTimeout(step,3000)};
  setTimeout(step,2800)}
setInterval(kegel,60*60*1000);
const standalone=matchMedia('(display-mode: standalone)').matches;
document.getElementById('installTip').hidden=standalone;
cv.addEventListener('pointerdown',()=>{try{if(standalone&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}},{once:true});
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setInterval(save,10000);
document.getElementById('bSnd').onclick=e=>{sfx.unlock();const o=sfx.toggle();sndOn=o;e.currentTarget.textContent=T(o?'sndOn':'sndOff');e.currentTarget.setAttribute('aria-pressed',o)};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  cv.setAttribute('aria-label',T('aria'));document.getElementById('bSnd').textContent=T(sndOn?'sndOn':'sndOff');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('crablang',lang)}catch(e){}applyLang();say(T('hello'),1600)});
applyLang();
say(T('hello'),2600);
requestAnimationFrame(loop);
})();
