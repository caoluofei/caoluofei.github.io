/* Layout: a soft egg-shaped toy device holding the tank screen, stat chips and candy buttons; tips sit on cards below */
:root{
  --u:clamp(.5px,.0899vw,1px);
  --bg:#fdf1ea; --dot:#f7dccf; --ink:#5a3d45; --muted:#a07f86; --card:#fffaf6; --line:#f0d6cc;
  --shell1:#ffd6e1; --shell2:#ffc4ad; --shellEdge:#e7a0ad; --frame:#fff4ee;
  --accent:#ff8fa3; --track:#f6e3dc;
  --c1:#ffe08a; --c2:#ffb5c8; --c3:#b6e3c6; --c4:#cbbcf2; --c5:#a9d8f2; --c6:#ffc9a3; --btnInk:#4a3038;
  --f-pixel:"FusionPixel",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#271f2b; --dot:#32283a; --ink:#f7e6ec; --muted:#c3a8b4; --card:#30263a; --line:#43354d;
  --shell1:#6a4a68; --shell2:#5a4570; --shellEdge:#3c2c48; --frame:#3a2e44; --accent:#ff9db0; --track:#43354d; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-pixel);-webkit-font-smoothing:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background-image:radial-gradient(var(--dot) 2px,transparent 2.5px);background-size:28px 28px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:calc(var(--u)*18)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-weight:400;font-size:calc(var(--u)*36);margin:0;display:flex;align-items:center;gap:calc(var(--u)*12)}
h1 .logo{width:calc(var(--u)*48);height:calc(var(--u)*48);image-rendering:pixelated;background:var(--c2);border-radius:14px;box-shadow:0 3px 0 var(--shellEdge)}
.sub{color:var(--muted);font-size:calc(var(--u)*24);line-height:1.5;margin:0}

let box={x0:0,x1:0,y0:0,y1:0};
function updateFish(dt){const hy=FLOOR+crab.y-14*sc(),awake=crab.mode!=='sleep';
  fishes.forEach(f=>{f.flee=Math.max(0,f.flee-dt);
    const giving=crab.gift&&crab.gift.f===f;
    if(!f.food&&!giving&&fF(f)<2&&Math.random()<dt/4000){const fd=foods.find(o=>o.y>SURF+2&&o.y<FLOOR-3);if(fd&&Math.random()<.5)f.food=fd}
    if(f.food&&!foods.includes(f.food))f.food=null;
    const near=Math.hypot(f.x-crab.x,f.y-hy);
    if(!giving&&(crab.mode==='lift'||crab.mode==='fall'||(crab.chaseT>0&&crab.chase===f))&&near<22&&f.flee<=0){f.flee=900;f.food=null;f.tx=Math.max(8,Math.min(W-8,f.x+Math.sign(f.x-crab.x||1)*45));f.ty=SURF+6+Math.random()*(FLOOR-SURF-18)}
    if(f.food){f.tx=f.food.x;f.ty=f.food.y}
    if(giving){f.flee=0;f.food=null;f.tx=crab.x+(f.x<crab.x?-3:3);f.ty=FLOOR+crab.y-geo().H-4}
    const dx=f.tx-f.x,dy=f.ty-f.y,dist=Math.hypot(dx,dy),sp=f.flee>0?.05:f.food?.022:(L<.3?.005:.011);
    if(dist<1.5&&giving){}
    else if(dist<1.5){if(f.food){foods.splice(foods.indexOf(f.food),1);f.food=null;sfx.munch();if(awake&&crab.mode!=='lift')say(pick(T('fishAte')))}newTarget(f)}
    else{f.x+=dx/dist*sp*dt;f.y+=dy/dist*sp*dt*.7;if(Math.abs(dx)>.3)f.dir=Math.sign(dx)}
    if(!giving&&fF(f)<3&&awake&&crab.mode==='idle'&&crab.startleCD<=0&&near<7&&f.flee<=0){crab.startleCD=25000;setMode('wave',800);say(pick(T('startle')),1600);sfx.yelp();f.flee=900;f.tx=Math.max(8,Math.min(W-8,f.x+Math.sign(f.x-crab.x||1)*40))}})}
function focusing(){return st.pomo&&st.pomo.phase==='focus'}
function update(dt){

  st.food=Math.max(0,st.food-dt/9000);st.mood=Math.max(0,st.mood-dt/12000);
  // food falling
  foods.forEach(f=>{if(f.y<FLOOR-1){const was=f.y;f.y=Math.min(FLOOR-1,f.y+dt/(f.y>SURF?60:18));if(was<SURF&&f.y>=SURF){sfx.plop();poke(f.x,3,1.2);splash(f.x,3,.5)}}});
  sparks.forEach(s=>{s.y-=dt/80;s.life-=dt});sparks=sparks.filter(s=>s.life>0);

  const m=crab.mode;
  if(m==='lift'){sfx.flail();return}
  if(m==='fall'){crab.vy+=dt*0.0012;if(FLOOR+crab.y>SURF+4)crab.vy=Math.min(crab.vy,.05);crab.y+=crab.vy*dt;
    if(crab.y>=0){crab.y=0;crab.tx=crab.x;setMode('idle');sfx.thud();say(pick(T('land')));lastTouch=performance.now()}
    return}
  updateFish(dt);
  sand.forEach(s=>{s.vy+=.0004*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});sand=sand.filter(s=>s.life>0&&s.y<=FLOOR+1);
  if(!treasure&&st.items.length<12){treasureT-=dt;if(treasureT<=0){treasureT=60000+Math.random()*60000;
    let x;do{x=12+Math.random()*(W-24)}while(Math.abs(x-NC)<20);treasure={x,type:['shell','pearl','key','coin','glass'][Math.floor(Math.random()*5)]}}}
  if(crab.gift&&(crab.gift.t-=dt)<=0){st.items.push(crab.gift.item);crab.gift=null}
  crab.chaseT=(crab.chaseT||0)-dt;crab.startleCD=(crab.startleCD||0)-dt;
  const night=L<.3;
  if(m==='sleep'){if(prevNight&&!night){prevNight=night;setMode('happy',1800);say(pick(T('morning')),2600);sfx.chirp();lastTouch=performance.now()}prevNight=night;return}
  prevNight=night;
  if(m==='molt'){if(crab.modeT<=0){st.shells.push({x:Math.round(crab.x),lvl:st.lvl});if(st.shells.length>3)st.shells.shift();
      st.xp-=NEED[st.lvl];st.lvl++;if(st.lvl>=4)st.xp=0;crab.tx=clampX(crab.x+(crab.x>W-40?-20:20));setMode('happy',2000);say(T('grown')+' '+T('stages')[st.lvl],2800);sfx.sparkle();
      for(let i=0;i<8;i++)sparks.push({x:crab.x-10+Math.random()*20,y:FLOOR-22,life:1200});save()}return}
  if(m==='dig'){if(Math.random()<dt/40){sand.push({x:crab.x+(Math.random()-.5)*10,y:FLOOR-1,vx:(Math.random()-.5)*.06,vy:-.04-Math.random()*.05,life:900});sfx.dig()}
    if(crab.modeT<=0){if(treasure){crab.carry=treasure.type;treasure=null;say(pick(T('found')));sfx.sparkle()}setMode('idle')}return}
  if((m==='wave'||m==='happy'||m==='eat')&&crab.modeT<=0)setMode('idle');
  if(crab.mode==='idle'&&st.lvl<4&&st.xp>=NEED[st.lvl]&&!crab.carry&&!foods.length){setMode('molt',2600);say(T('molt'),2600);sfx.crack();return}
  if(crab.mode==='idle'||crab.mode==='walk'){
    const landed=foods.find(f=>f.y>=FLOOR-1);
    if(landed)crab.tx=landed.x;
    else if(crab.gift)crab.tx=clampX(crab.gift.f.x);
    else if(crab.carry)crab.tx=NC+6;
    else if(crab.chaseT>0&&crab.chase)crab.tx=clampX(crab.chase.x);
    else if(treasure&&!crab.home&&!night)crab.tx=treasure.x;
    const d=crab.tx-crab.x;
    if(Math.abs(d)>0.6){crab.dir=Math.sign(d);crab.x+=crab.dir*dt/(crab.chaseT>0?36:55);crab.mode='walk';const lp=Math.floor(crab.t/110)%2;if(lp!==crab.lp){crab.lp=lp;sfx.step()}}
    else{
      crab.mode='idle';
      if(crab.gift){const f=crab.gift.f;if(Math.abs(crab.x-f.x)<4&&Math.hypot(f.x-crab.x,f.y-(FLOOR+crab.y-geo().H-4))<5){giveGift(f);return}}
      if(crab.home&&!landed&&Math.abs(crab.x-NC)<1){crab.home=false;crab.x=NC;setMode('sleep');bubble.hidden=true;return}
      if(landed&&Math.abs(landed.x-crab.x)<3){foods.splice(foods.indexOf(landed),1);st.food=Math.min(100,st.food+(landed.gold?40:25));st.mood=Math.min(100,st.mood+(landed.gold?10:5));addXP(landed.gold?20:12);setMode('eat',1400);say(pick(lines.eat));sfx.munch()}
      else if(crab.carry&&Math.abs(crab.x-(NC+6))<1.2){st.items.push(crab.carry);crab.carry=null;addXP(8);st.mood=Math.min(100,st.mood+6);say(T('stash'));setMode('happy',1200);sfx.place();save()}
      else if(treasure&&!crab.carry&&!night&&Math.abs(crab.x-treasure.x)<1.2){setMode('dig',1400)}
      else if(!foods.length&&!crab.home&&Math.random()<dt/5000){crab.tx=Math.max(18,Math.min(W-34,crab.x+(Math.random()*60-30)))}
    }
  }
  if(performance.now()-lastTouch>(night?12000:40000)&&!foods.length&&!crab.carry&&!crab.gift&&crab.mode!=='sleep'&&crab.mode!=='molt'&&!crab.home){crab.home=true;crab.tx=NC;say(night?pick(T('night')):T('sleepy'),1800)}
  if(st.food<15&&Math.random()<dt/20000&&bubble.hidden&&!focusing())say(pick(lines.hungry));
  // chase a fish now and then
  if(crab.mode==='idle'&&!night&&!crab.home&&!crab.carry&&!foods.length&&!treasure&&crab.chaseT<=0&&Math.random()<dt/30000){
    const f=fishes.find(f=>f.y>FLOOR-26);if(f){crab.chase=f;crab.chaseT=3200;say(pick(T('chase')),1800);sfx.chirp()}}
}

  if(down.lift){crab.vy=0;setMode(crab.y<0?'fall':'idle');if(crab.y>=0){crab.tx=crab.x;bubble.hidden=true}down=null;return}
  if(down.on&&down.moved<4){if(!wake()){if(onClaw(down.p)){clawPoke(down.p);down=null;save();return}setMode('wave',1200);say(pick(lines.tap));sfx.click();st.mood=Math.min(100,st.mood+2)}}
  else if(!down.on&&down.dist<3){wake();const f=hitFish(p);if(f)startGift(f);else crab.tx=Math.max(16,Math.min(W-34,p.x))}
  down=null;save()});

document.getElementById('bFeed').onclick=()=>{lastTouch=performance.now();crab.home=false;wake();foods.push({x:Math.max(16,Math.min(W-34,crab.x+(Math.random()*80-40))),y:0})};
document.getElementById('bPet').onclick=()=>{lastTouch=performance.now();if(!wake())pet()};
document.getElementById('bSleep').onclick=()=>{if(crab.mode==='sleep'){wake();lastTouch=performance.now()}else{crab.home=true;crab.tx=NC;lastTouch=-1e9;say(T('gohome'),1500)}};
function notify(t){try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')new Notification(T('title'),{body:t,icon:'icon-192.png',tag:'crab'})}catch(e){}}
setInterval(()=>{if(focusing())return;if(crab.mode==='sleep'){setMode('idle')}lastTouch=performance.now();setMode('wave',1500);sfx.click();const t=pick(lines.water);say(t,5000);notify(t)},30*60*1000);
function kegel(){if(focusing())return;const K=T('kegel');crab.home=false;if(crab.mode==='sleep')setMode('idle');lastTouch=performance.now();
  setMode('wave',1500);sfx.chirp();say(K[0],2600);notify(K[0]);let i=0;
  const step=()=>{if(i>=10){say(T('kegel')[3],2600);setMode('happy',1500);return}
    if(i===9)addXP(5);
    const squeeze=i%2===0;say(T('kegel')[squeeze?1:2],2900);if(squeeze){crab.blush=2900;crab.squeeze=2900;sfx.purr()}else crab.squeeze=0;i++;lastTouch=performance.now();setTimeout(step,3000)};
  setTimeout(step,2800)}
setInterval(kegel,60*60*1000);
const standalone=matchMedia('(display-mode: standalone)').matches;
document.getElementById('installTip').hidden=standalone;
cv.addEventListener('pointerdown',()=>{try{if(standalone&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}},{once:true});
if('serviceWorker' in navigator&&/github\.io$/.test(location.hostname)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setInterval(save,10000);
const bFocus=document.getElementById('bFocus'),bFocusL=document.getElementById('bFocusL'),pomoEl=document.getElementById('pomo');
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tickPomo(){const P=st.pomo;bFocusL.textContent=T(P?'stop':'focus');bFocus.setAttribute('aria-pressed',!!P);
  if(!P){pomoEl.hidden=true;return}const left=P.end-Date.now();pomoEl.hidden=false;pomoEl.textContent=T(P.phase==='focus'?'focusLabel':'breakLabel')+' '+fmt(left);
  if(left<=0){if(P.phase==='focus'){st.pomo={phase:'break',end:Date.now()+5*60e3};addXP(20);if(crab.mode==='sleep')setMode('idle');setMode('happy',2000);say(T('focusEnd'),6000);notify(T('focusEnd'));sfx.chime()}
    else{st.pomo=null;if(crab.mode==='sleep')setMode('idle');setMode('wave',1500);say(T('breakEnd'),4000);notify(T('breakEnd'));sfx.chime()}lastTouch=performance.now();save()}}
bFocus.onclick=()=>{sfx.unlock();lastTouch=performance.now();if(st.pomo){st.pomo=null;say(T('focusStop'),1800)}else{st.pomo={phase:'focus',end:Date.now()+25*60e3};wake();say(T('focusStart'),2600);sfx.chirp()}save()};
function setDeco(on){decoMode=on;palette.hidden=!on;document.getElementById('bDeco').setAttribute('aria-pressed',on);if(!on){decoPick=null;dragDeco=null;drag=null;selected.clear();refreshSel()}
  document.querySelectorAll('[data-deco]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.deco===decoPick))}
document.getElementById('bDeco').onclick=()=>setDeco(!decoMode);
document.getElementById('bDone').onclick=()=>{setDeco(false);save()};
document.getElementById('bUndo').onclick=()=>{if(st.decos.pop()){syncWeeds();refreshSel();sfx.place();save()}};
function delSelected(){if(!selected.size)return;st.decos=st.decos.filter(d=>!selected.has(d));selected.clear();syncWeeds();refreshSel();sfx.thud();save()}
document.getElementById('bDel').onclick=delSelected;
const bClear=document.getElementById('bClear');let clearArm=null;
bClear.onclick=()=>{if(!st.decos.length)return;
  if(clearArm){clearTimeout(clearArm);clearArm=null;bClear.classList.remove('warn');bClear.textContent=T('clearAll');st.decos=[];selected.clear();syncWeeds();refreshSel();sfx.thud();save();return}
  bClear.classList.add('warn');bClear.textContent=T('sure');clearArm=setTimeout(()=>{clearArm=null;bClear.classList.remove('warn');bClear.textContent=T('clearAll')},3000)};
addEventListener('keydown',e=>{if(decoMode&&(e.key==='Delete'||e.key==='Backspace')&&selected.size){e.preventDefault();delSelected()}});
// pixel thumbnails for the tiles, drawn with the same code as the tank
document.querySelectorAll('[data-thumb]').forEach(c=>{const t=c.dataset.thumb,g=c.getContext('2d'),keep=ctx;ctx=g;
  const s=DECO[t],box=Math.max(s.w*2+4,s.h+5),cx=Math.round(box/2)+(t==='wood'?1:0);g.save();const k=c.width/(box*S);g.scale(k,k);g.translate(0,-(FLOOR-(box-2))*S);
  drawDeco({type:t,x:cx});g.restore();c.style.setProperty('--sand',((box-2)/box*100).toFixed(1)+'%');ctx=keep});
document.querySelectorAll('[data-deco]').forEach(b=>b.onclick=()=>{decoPick=decoPick===b.dataset.deco?null:b.dataset.deco;setDeco(true)});
syncWeeds();
(()=>{const c=document.getElementById('logo'),g=c.getContext('2d'),P=(x,y,w,hh,col)=>{g.fillStyle=col;g.fillRect(x*3,y*3,w*3,hh*3)};
  [[5,6],[4,8],[3,10],[3,10],[3,10],[4,8]].forEach(([x,w],i)=>P(x,8+i,w,1,'#e8743b'));P(5,5,1,3,'#b4502a');P(10,5,1,3,'#b4502a');
  P(4,3,3,3,'#fff7ee');P(9,3,3,3,'#fff7ee');P(5,4,2,2,'#2a1d18');P(10,4,2,2,'#2a1d18');P(7,11,2,1,'#2a1d18');P(4,11,2,1,'#ff9b8a');P(10,11,2,1,'#ff9b8a');
  P(1,7,2,3,'#e8743b');P(13,7,2,3,'#e8743b')})();
document.getElementById('bSnd').onclick=e=>{sfx.unlock();const o=sfx.toggle();sndOn=o;document.getElementById('bSndL').textContent=T(o?'sndOn':'sndOff');e.currentTarget.setAttribute('aria-pressed',o)};

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T(el.dataset.i18n));
  cv.setAttribute('aria-label',T('aria'));document.getElementById('bSndL').textContent=T(sndOn?'sndOn':'sndOff');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('crablang',lang)}catch(e){}applyLang();say(T('hello'),1600)});
applyLang();
say(T('hello'),2600);
requestAnimationFrame(loop);
})();
</script>
