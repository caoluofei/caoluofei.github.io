/* Layout: a soft egg-shaped toy device holding the tank screen, stat chips and candy buttons; tips sit on cards below */
:root {
  --u: clamp(0.5px, 0.0899vw, 1px);
  --bg: #fdf1ea;
  --dot: #f7dccf;
  --ink: #5a3d45;
  --muted: #a07f86;
  --card: #fffaf6;
  --line: #f0d6cc;
  --shell1: #ffd6e1;
  --shell2: #ffc4ad;
  --shellEdge: #e7a0ad;
  --frame: #fff4ee;
  --accent: #ff8fa3;
  --track: #f6e3dc;
  --c1: #ffe08a;
  --c2: #ffb5c8;
  --c3: #b6e3c6;
  --c4: #cbbcf2;
  --c5: #a9d8f2;
  --c6: #ffc9a3;
  --btnInk: #4a3038;
  --f-pixel: "TinyCrabPixel", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #271f2b;
    --dot: #32283a;
    --ink: #f7e6ec;
    --muted: #c3a8b4;
    --card: #30263a;
    --line: #43354d;
    --shell1: #6a4a68;
    --shell2: #5a4570;
    --shellEdge: #3c2c48;
    --frame: #3a2e44;
    --accent: #ff9db0;
    --track: #43354d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #271f2b;
  --dot: #32283a;
  --ink: #f7e6ec;
  --muted: #c3a8b4;
  --card: #30263a;
  --line: #43354d;
  --shell1: #6a4a68;
  --shell2: #5a4570;
  --shellEdge: #3c2c48;
  --frame: #3a2e44;
  --accent: #ff9db0;
  --track: #43354d;
  color-scheme: dark;
}
html,
body {
  background: var(--bg);
  color: var(--ink);
}
body {
  font-family: var(--f-pixel);
  -webkit-font-smoothing: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px;
  background-image: radial-gradient(var(--dot) 2px, transparent 2.5px);
  background-size: 28px 28px;
}
.wrap {
  max-width: min(1080px, max(360px, calc((100svh - 400px) * 1.333 + 60px)));
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 18);
}
.head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
h1 {
  font-weight: 400;
  font-size: calc(var(--u) * 36);
  margin: 0;
  display: flex;
  align-items: center;
  gap: calc(var(--u) * 12);
}
h1 .logo {
  width: calc(var(--u) * 48);
  height: calc(var(--u) * 48);
  image-rendering: pixelated;
  background: var(--c2);
  border-radius: 14px;
  box-shadow: 0 3px 0 var(--shellEdge);
}
.sub {
  color: var(--muted);
  font-size: calc(var(--u) * 24);
  line-height: 1.5;
  margin: 0;
}
/* the toy */
.win {
  position: relative;
  background: linear-gradient(160deg, var(--shell1), var(--shell2));
  border-radius: calc(var(--u) * 56);
  padding: calc(var(--u) * 22) calc(var(--u) * 24) calc(var(--u) * 26);
  box-shadow:
    0 calc(var(--u) * 10) 0 var(--shellEdge),
    inset 0 calc(var(--u) * 6) 0 rgba(255, 255, 255, 0.45);
  display: flex;
  flex-direction: column;
  gap: calc(var(--u) * 16);
}
.win::before,
.win::after {
  content: "";
  position: absolute;
  width: calc(var(--u) * 14);
  height: calc(var(--u) * 14);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  top: calc(var(--u) * 26);
}
.win::before {
  left: calc(var(--u) * 34);
}
.win::after {
  left: calc(var(--u) * 58);
  opacity: 0.6;
}
.bar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding-inline: calc(var(--u) * 56) 4px;
  font-size: calc(var(--u) * 24);
  color: var(--ink);
  opacity: 0.7;
  min-height: calc(var(--u) * 30);
}
.barR {
  display: flex;
  justify-content: flex-end;
}
.lampsw {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: calc(var(--u) * 92);
  height: calc(var(--u) * 40);

function fillIcons(root = document) {
  root.querySelectorAll("svg[data-icon]").forEach(svg => {
    const rows = ICONS[svg.dataset.icon];
    let rects = "";
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        if (row[x] !== "#") continue;
        let w = 1;
        while (row[x + w] === "#") w++;
        rects += `<rect x="${x}" y="${y}" width="${w}" height="1"/>`;
        x += w - 1;
      }
    });
    svg.setAttribute("viewBox", "0 0 12 12");
    svg.setAttribute("shape-rendering", "crispEdges");
    svg.setAttribute("fill", svg.dataset.fill || "currentColor");
    svg.setAttribute("aria-hidden", "true");
    svg.innerHTML = rects;
  });
}

// fill in fields added over time and upgrade old saves
function migrate(s) {
  const ver = s.ver || (s.v2 ? 2 : 1);
  if (ver < 2) {
    // v2 brought the five growth stages: everyone starts again as a baby crab
    s.lvl = 0;
    s.xp = 0;
    s.shells = [];
  }
  if (!Array.isArray(s.fishF)) s.fishF = [0, 0];
  if (typeof s.coins !== "number") s.coins = 0;
  if (typeof s.weight !== "number") s.weight = 0;
  if (!Array.isArray(s.owned)) s.owned = [];
  // retired decorations
  s.decos.forEach(d => {
    if (d.type === "castle") d.type = "conch";
    if (d.type === "weed") d.type = "wood";
  });
  delete s.v2;
  s.ver = SAVE_VERSION;
}

        if (t && Math.abs(r.x - g.x) <= DECO[g.type].w - 1 && r._base === (g._base || 0) + t) {

// awake: one food cell every 2 min, one mood cell every 3 min; asleep, at night or while closed: a quarter of that
function decay() {
  const now = Date.now(),
    el = Math.max(0, now - (st.seen || now));
  st.seen = now;
  if (!el || st.ghost) return;
  const away = el > 5000,
    rest = away || crab.mode === "sleep" || L < 0.3 ? 0.25 : 1;

  st.food = Math.max(0, st.food - (el / 12000) * rest);
  st.mood = Math.max(0, st.mood - (el / 18000) * rest);

  const hr = el / 3.6e6,
    f1 = st.food,
    span = f0 - f1,
    hi = span > 0 ? Math.max(0, f0 - Math.max(f1, 85)) / span : f1 > 85 ? 1 : 0,
    lo = span > 0 ? Math.max(0, Math.min(f0, 25) - f1) / span : f1 < 25 ? 1 : 0,
    mid = Math.max(0, 1 - hi - lo);
  st.weight += 0.25 * hr * hi - 0.3 * hr * lo;
  st.weight -= Math.sign(st.weight) * Math.min(Math.abs(st.weight), 0.08 * hr * mid);
  st.weight = Math.max(-1, Math.min(1, st.weight));
}

function arcUpdate(dt) {

    const hh = dt / steps;
    arc.balls.forEach(b => {
      b.x += b.vx * hh;
      b.y += b.vy * hh;

        b.vy = Math.sin(a) * arcSp();

        crab.mode = "happy";
        crab.modeT = 250;
      }

        if (b.x + 1 < k.x || b.x - 1 > k.x + ABW - 1 || b.y + 1 < k.y || b.y - 1 > k.y + ABH) continue;

            arc.fx.push({
              x: k.x + ABW / 2,
              y: k.y + 1,
              vx: (Math.random() - 0.5) * 0.06,
              vy: (Math.random() - 0.8) * 0.05,
              life: 450,

            });
          const r = Math.random();
          if (r < 0.12) arc.drops.push({ x: k.x + ABW / 2, y: k.y + ABH, k: "coin" });

      arc.noteT = 1200;

  }
  if (!arc.bricks.length) {
    arc.level++;
    arc.earned += 3;

  if (Math.abs(ghost.x - crab.x) < g.bw / 2 + 5 && ghost.y > FLOOR - g.bh - 12) revive();
  else {
    ghost.t = 1500;

}
function revive() {
  st.ghostTaught = true;
  st.weight = Math.min(st.weight, -0.6);
  st.ghost = false;
  ghost = null;
  st.food = 40;
  st.mood = 40;
  st.seen = Date.now();
  crab.mode = "idle";
  setMode("happy", 2200);
  crab.blush = 2200;
  say(T("revive"), 3000);
  sfx.revive();

    sparks.push({ x: crab.x - 12 + Math.random() * 24, y: FLOOR - 6 - Math.random() * 14, life: 1300 });

function drawGhost(now) {
  if (!st.ghost || !ghost) return;
  const { g } = geo(),
    rows = bodyRows(g),
    gx = Math.round(ghost.x),
    gy = Math.round(ghost.y + (gdrag ? 0 : Math.sin(now / 400) * 1.2)),
    top = gy - (g.bh - 1);
  ctx.save();
  const cx = gx * S,
    cy = (gy - g.bh / 2) * S,
    r = (g.bw + 6) * S,
    gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  gr.addColorStop(0, "rgba(200,240,255,.35)");
  gr.addColorStop(1, "rgba(200,240,255,0)");
  ctx.fillStyle = gr;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  ctx.globalAlpha = 0.62 + 0.15 * Math.sin(now / 300);
  rows.forEach(([ry, w]) => px(gx - w / 2, gy + ry + 4, w, 1, "#eafaff"));
  const w0 = rows[0][1],
    ph = Math.floor(now / 160);
  for (let i = -w0 / 2; i < w0 / 2; i++) {
    if ((i + ph) % 3 !== 0) px(gx + i, gy + 1, 1, 1, "#eafaff");
    if ((i + ph) % 3 === 1) px(gx + i, gy + 2, 1, 1, "#eafaff");
  }
  const ox = Math.floor(g.bw / 2) + 2,
    cyc = top + 1 + Math.round(Math.sin(now / 250));
  px(gx - ox - 2, cyc, 2, 2, "#eafaff");
  px(gx + ox, cyc, 2, 2, "#eafaff");
  const ex = Math.max(2, Math.round(g.bw / 4));
  px(gx - ex - 1, top + 1, 2, 2, "#3a5566");
  px(gx + ex - 1, top + 1, 2, 2, "#3a5566");
  px(gx - 1, top + Math.max(3, g.bh - 2), 2, 1, "#3a5566");
  ctx.restore();
}

// ---- a clear guide while the crab is a ghost: banner, dotted path, a hand showing the drag, and a target ring ----
const HAND = [
  "....##.....",
  "...#ww#....",
  "...#ww#....",
  "...#ww####.",
  "...#ww#ww##",
  ".###wwwwww#",
  "#ww#wwwwww#",
  "#wwwwwwwww#",
  ".#wwwwwww#.",
  "..#wwwwww#.",
  "..########.",
];
function drawHand(x, y, alpha) {
  ctx.globalAlpha = alpha;
  HAND.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {
      if (row[i] === "#") px(x - 4 + i, y + j, 1, 1, "#2a1d18");
      else if (row[i] === "w") px(x - 4 + i, y + j, 1, 1, "#ffffff");
    }
  });
  ctx.globalAlpha = 1;
}
function drawGhostGuide(now) {
  // only until the player has brought the crab back once
  if (!st.ghost || !ghost || view !== "out" || st.ghostTaught) return;
  const { g, top } = geo(),
    bx = crab.x,
    by = FLOOR + top + Math.floor(g.bh / 2),
    pulse = 0.5 + 0.5 * Math.sin(now / 260);
  // target ring around the body
  ctx.save();
  ctx.strokeStyle = `rgba(255,224,138,${gdrag ? 0.95 : 0.55 + 0.35 * pulse})`;
  ctx.lineWidth = S * (gdrag ? 1.2 : 0.8);
  ctx.setLineDash([S * 1.5, S]);
  ctx.lineDashOffset = -now / 40;
  ctx.beginPath();
  ctx.ellipse(bx * S, by * S, (g.bw / 2 + 7 + pulse * 1.5) * S, (g.bh / 2 + 6 + pulse) * S, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
  if (gdrag) return;
  // dotted curved path from the ghost to the body, with an arrow head
  const sx = ghost.x,
    sy = ghost.y - g.bh / 2,
    mx = (sx + bx) / 2 + (bx > sx ? -8 : 8),
    my = Math.min(sy, by) - 10,
    ex = bx,
    ey = by - g.bh / 2 - 6,
    at = t => [
      (1 - t) * (1 - t) * sx + 2 * (1 - t) * t * mx + t * t * ex,
      (1 - t) * (1 - t) * sy + 2 * (1 - t) * t * my + t * t * ey,
    ],
    shift = (now / 900) % 1;
  for (let i = 0; i < 14; i++) {
    const t = (i + shift) / 14;
    if (t < 0.12 || t > 0.94) continue;
    const [x, y] = at(t);
    px(x, y, 2, 2, `rgba(255,236,170,${0.55 + 0.45 * t})`);
  }
  const [ax, ay] = at(0.97),
    [qx, qy] = at(0.9),
    dx = Math.sign(Math.round(ax - qx));
  px(ax, ay, 1, 1, "#ffe08a");
  px(ax - 1, ay - 1, 1, 1, "#ffe08a");
  px(ax + 1, ay - 1, 1, 1, "#ffe08a");
  if (dx) px(ax - dx, ay, 1, 1, "#ffe08a");
  // a hand that grabs the ghost and carries it along the path, every few seconds
  const cyc = (now % 3000) / 3000;
  if (cyc < 0.85) {
    const t = cyc < 0.15 ? 0 : Math.min(1, (cyc - 0.15) / 0.6),
      e = t * t * (3 - 2 * t),
      [hx, hy] = at(e),
      fade = cyc < 0.08 ? cyc / 0.08 : cyc > 0.75 ? (0.85 - cyc) / 0.1 : 1;
    drawHand(hx, hy + 1, Math.max(0, fade) * 0.9);
  }
  // banner at the top of the water
  ctx.save();
  ctx.font = `30px ${css("--f-pixel")}`;
  const text = T("ghostGuide"),
    tw = ctx.measureText(text).width,
    bw = tw + 48,
    bh = 50,
    x0 = cv.width / 2 - bw / 2,
    y0 = (SURF + 6) * S;
  ctx.fillStyle = "rgba(20,24,48,.72)";
  ctx.beginPath();
  ctx.roundRect(x0, y0, bw, bh, bh / 2);
  ctx.fill();
  ctx.strokeStyle = `rgba(255,224,138,${0.5 + 0.4 * pulse})`;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, cv.width / 2, y0 + bh / 2 + 2);
  ctx.restore();
}

// ===== 12-update-loop.js =====
function update(dt) {
  crab.t += dt;
  crab.modeT -= dt;
  crab.angerT -= dt;
  crab.squeeze = Math.max(0, (crab.squeeze || 0) - dt);
  crab.blush = Math.max(0, crab.blush - dt);
  decay();
  // food falling
  foods.forEach(f => {
    if (f.arc) {
      f.vy += 0.0006 * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.x > W - 16) {
        f.x = W - 16;
        f.vx = -Math.abs(f.vx) * 0.5;
      }
      if (f.x < 36) {
        f.x = 36;
        f.vx = Math.abs(f.vx) * 0.5;
      }
      if (f.y >= FLOOR - 1) {
        f.y = FLOOR - 1;
        if (f.bounce > 0 && f.vy > 0.03) {
          f.vy *= -0.35;
          f.vx *= 0.6;
          f.bounce--;
          sfx.place();
        } else {
          f.arc = 0;
          f.landed = 1;
          sfx.place();
        }
      }
      return;
    }
    if (f.y < FLOOR - 1) {
      const was = f.y;
      f.y = Math.min(FLOOR - 1, f.y + dt / (view === "home" ? 14 : f.y > SURF ? 60 : 18));
      if (view === "home" && f.y >= FLOOR - 1 && !f.landed) {
        f.landed = 1;
        sfx.place();
      }
      if (was < SURF && f.y >= SURF && view !== "home") {
        breakIce(f.x, 1, true);
        sfx.plop();
        poke(f.x, 3, 1.2);
        splash(f.x, 3, 0.5);
      }
    }
  });
  sparks.forEach(s => {
    s.y -= dt / 80;
    s.life -= dt;
  });
  sparks = sparks.filter(s => s.life > 0);

  if (view === "arcade") {
    arcUpdate(dt);
    return;
  }
  if (
    Math.random() < dt / 60000 &&
    bubble.hidden &&
    !st.ghost &&
    crab.mode !== "sleep" &&
    Math.abs(st.weight) > 0.6
  )
    say(pick(T(st.weight > 0 ? "fatSay" : "thinSay")), 2400);
  if (
    Math.random() < dt / 45000 &&
    st.mood < 35 &&
    bubble.hidden &&
    !st.ghost &&
    crab.mode !== "sleep" &&
    !focusing()
  )
    say(pick(T("wantPlay")), 2400);
  if (Math.random() < dt / 120000 && bubble.hidden && !st.ghost && crab.mode !== "sleep" && view === "out")
    say(pick(T("seasonSay")[season()]), 2400);
  const m = crab.mode;
  if (m === "lift") {
    sfx.flail();
    return;
  }
  if (view === "home" && m !== "fall") {
    homeUpdate(dt);
    return;
  }
  if (m === "fall") {
    const hv = st.weight > 0 ? 1 + st.weight * 1.3 : 1 + st.weight * 0.45;
    crab.vy += dt * 0.0012 * hv;
    if (FLOOR + crab.y > SURF + 4 && view !== "home") crab.vy = Math.min(crab.vy, 0.05 * hv);
    crab.y += crab.vy * dt;
    if (crab.y >= 0) {
      crab.y = 0;
      crab.tx = crab.x;
      setMode("idle");
      sfx.thud();
      say(pick(T("land")));
      lastTouch = performance.now();
    }
    return;
  }
  updateFish(dt);
  sand.forEach(s => {
    s.vy += 0.0004 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
  });
  sand = sand.filter(s => s.life > 0 && s.y <= FLOOR + 1);
  if (!treasure && st.items.length < 12) {
    treasureT -= dt;
    if (treasureT <= 0) {
      treasureT = 60000 + Math.random() * 60000;
      let x;
      do {
        x = 12 + Math.random() * (W - 24);
      } while (Math.abs(x - NC) < 20);
      treasure = { x, type: ["shell", "pearl", "key", "coin", "glass"][Math.floor(Math.random() * 5)] };
    }
  }
  if (!st.ghost && st.food <= 0 && !["lift", "fall", "molt"].includes(crab.mode)) becomeGhost();
  if (st.ghost) {
    updateGhost(dt);
    return;
  }
  if (crab.gift && (crab.gift.t -= dt) <= 0) {
    st.items.push(crab.gift.item);
    crab.gift = null;
  }
  crab.chaseT = (crab.chaseT || 0) - dt;
  crab.startleCD = (crab.startleCD || 0) - dt;
  const night = L < 0.3;
  if (m === "sleep") {
    if (prevNight && !night) {
      prevNight = night;
      setMode("happy", 1800);
      say(pick(T("morning")), 2600);
      sfx.chirp();
      lastTouch = performance.now();
    }
    prevNight = night;
    return;
  }
  prevNight = night;
  if (m === "molt") {
    if (crab.modeT <= 0) {
      st.shells.push({ x: Math.round(crab.x), lvl: st.lvl });
      if (st.shells.length > 3) st.shells.shift();
      st.xp -= NEED[st.lvl];
      st.lvl++;
      if (st.lvl >= 4) st.xp = 0;
      crab.tx = clampX(crab.x + (crab.x > W - 40 ? -20 : 20));
      setMode("happy", 2000);
      say(T("grown") + " " + T("stages")[st.lvl], 2800);
      sfx.sparkle();
      for (let i = 0; i < 8; i++)
        sparks.push({ x: crab.x - 10 + Math.random() * 20, y: FLOOR - 22, life: 1200 });
      save();
    }
    return;
  }
  if (m === "dig") {
    if (Math.random() < dt / 40) {
      sand.push({
        x: crab.x + (Math.random() - 0.5) * 10,
        y: FLOOR - 1,
        vx: (Math.random() - 0.5) * 0.06,
        vy: -0.04 - Math.random() * 0.05,
        life: 900,
      });
      sfx.dig();
    }
    if (crab.modeT <= 0) {
      if (treasure) {
        crab.carry = treasure.type;
        treasure = null;
        say(pick(T("found")));
        sfx.sparkle();
      }
      setMode("idle");
    }
    return;
  }
  if ((m === "wave" || m === "happy" || m === "eat") && crab.modeT <= 0) setMode("idle");
  if (crab.mode === "idle" && st.lvl < 4 && st.xp >= NEED[st.lvl] && !crab.carry && !foods.length) {
    setMode("molt", 2600);
    say(T("molt"), 2600);
    sfx.crack();
    return;
  }
  if (crab.mode === "idle" || crab.mode === "walk") {
    const landed = foods.find(f => f.y >= FLOOR - 1);
    if (landed) crab.tx = landed.x;
    else if (crab.gift) crab.tx = clampX(crab.gift.f.x);
    else if (crab.carry) crab.tx = NC + 6;
    else if (crab.chaseT > 0 && crab.chase) crab.tx = clampX(crab.chase.x);
    else if (treasure && !crab.home && !night) crab.tx = treasure.x;
    const d = crab.tx - crab.x;
    if (Math.abs(d) > 0.6) {
      crab.dir = Math.sign(d);
      crab.x += (crab.dir * dt) / ((crab.chaseT > 0 ? 36 : 55) * (1 + Math.max(0, st.weight) * 0.7));
      crab.mode = "walk";
      const lp = Math.floor(crab.t / 110) % 2;
      if (lp !== crab.lp) {
        crab.lp = lp;
        sfx.step();
      }
    } else {
      crab.mode = "idle";
      if (crab.gift) {
        const f = crab.gift.f;
        if (
          Math.abs(crab.x - f.x) < 4 &&
          Math.hypot(f.x - crab.x, f.y - (FLOOR + crab.y - geo().H - 4)) < 5
        ) {
          giveGift(f);
          return;
        }
      }
      if (crab.home && !landed && Math.abs(crab.x - NC) < 1) {
        crab.home = false;
        crab.x = NC;
        setMode("sleep");
        bubble.hidden = true;
        return;
      }
      if (landed && Math.abs(landed.x - crab.x) < 3) {
        foods.splice(foods.indexOf(landed), 1);
        st.food > 85 && (st.weight = Math.min(1, st.weight + 0.07)),
          (st.food = Math.min(100, st.food + (landed.gold ? 40 : 25)));
        st.mood = Math.min(100, st.mood + (landed.gold ? 10 : 5));
        addXP(landed.gold ? 20 : 12);
        setMode("eat", 1400);
        say(pick(lines.eat));
        sfx.munch();
      } else if (crab.carry && Math.abs(crab.x - (NC + 6)) < 1.2) {
        st.items.push(crab.carry);
        crab.carry = null;
        addXP(8);
        st.mood = Math.min(100, st.mood + 6);
        say(T("stash"));
        setMode("happy", 1200);
        sfx.place();
        save();
      } else if (treasure && !crab.carry && !night && Math.abs(crab.x - treasure.x) < 1.2) {
        setMode("dig", 1400);
      } else if (!foods.length && !crab.home && Math.random() < dt / 5000) {
        crab.tx = Math.max(18, Math.min(W - 34, crab.x + (Math.random() * 60 - 30)));
      }
    }
  }
  if (
    performance.now() - lastTouch > (night ? 12000 : 40000) &&
    !foods.length &&
    !crab.carry &&
    !crab.gift &&
    crab.mode !== "sleep" &&
    crab.mode !== "molt" &&
    !crab.home
  ) {
    crab.home = true;
    crab.tx = NC;
    say(night ? pick(T("night")) : T("sleepy"), 1800);
  }
  if (st.food < 15 && Math.random() < dt / 20000 && bubble.hidden && !focusing()) say(pick(lines.hungry));
  // chase a fish now and then
  if (
    crab.mode === "idle" &&
    !night &&
    !crab.home &&
    !crab.carry &&
    !foods.length &&
    !treasure &&
    crab.chaseT <= 0 &&
    Math.random() < dt / 30000
  ) {
    const f = fishes.find(f => f.y > FLOOR - 26);
    if (f) {
      crab.chase = f;
      crab.chaseT = 3200;
      say(pick(T("chase")), 1800);
      sfx.chirp();
    }
  }
}

// meters fill whole cells, like a toy's LCD: 10 cells, a cell lights as soon as it is reached
const meterN = {};
function setMeter(id, v) {
  const n = v <= 0 ? 0 : Math.min(10, Math.ceil(v / 10 - 1e-9));
  if (meterN[id] === n) return;
  meterN[id] = n;
  const el = document.getElementById(id);
  el.style.clipPath = `inset(0 ${100 - n * 10}% 0 0)`;
  el.parentElement.setAttribute("aria-valuenow", n * 10);
}
function loop(now) {
  const dt = Math.min(60, now - last);
  last = now;
  L += (LT - L) * Math.min(1, dt / 180);
  update(dt);
  if (view === "arcade") {
    drawArcade(performance.now());
    bubble.hidden = true;
  } else if (view === "home") {
    drawHome(performance.now());
    box = drawCrab();
    drawBlanket();
    drawNight();
    drawHomeGlow();
    drawLens();
  } else {
    physics(dt);
    drawScene();
    box = drawCrab();
    drawNestFront();
    drawGhost(performance.now());
    drawGhostGuide(performance.now());
    drawFront(performance.now());
    drawNight();
    drawLens();
  }
  drawPinch(dt);
  if (fadeT > 0) {
    fadeT -= dt;
    ctx.fillStyle = `rgba(30,20,25,${Math.max(0, fadeT / 350)})`;
    ctx.fillRect(0, 0, cv.width, cv.height);
  }
  if (bubT > 0) {
    bubT -= dt;
    if (bubT <= 0) bubble.hidden = true;
  }
  const r = cv.getBoundingClientRect(),
    k = r.width / cv.width;
  if (st.ghost && ghost) {
    bubble.style.left = ghost.x * S * k + "px";
    bubble.style.top = (ghost.y - geo().g.bh - 6) * S * k + "px";
  } else {
    bubble.style.left = crab.x * S * k + "px";
    bubble.style.top = (FLOOR + crab.y - 24 * sc()) * S * k + "px";
  }
  setMeter("mMood", st.mood);
  setMeter("mFood", st.food);
  setMeter("mGrow", st.lvl >= 4 ? 100 : (st.xp / NEED[st.lvl]) * 100);
  lvLabel.textContent = T("stages")[st.lvl];
  tickPomo();
  requestAnimationFrame(loop);
}

// ===== 13-input.js =====
function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
}
const onCrab = p => p.x >= box.x0 && p.x <= box.x1 && p.y >= box.y0 - 2 && p.y <= box.y1 + 1;
let down = null,
  pinch = null,
  sndOn = true;
function onClaw(p) {
  const { g, top } = geo(),
    y0 = FLOOR + crab.y,
    dx = Math.abs(p.x - crab.x),
    c = Math.floor(g.bw / 2) + 3;
  return (
    dx >= c - g.cs / 2 - 1 && dx <= c + g.cs / 2 + 1 && p.y >= y0 + top - 7 && p.y <= y0 + top + g.cs + 3
  );
}
function clawPoke(p) {
  const n0 = performance.now();
  if (n0 - crab.lastClaw > 4000) crab.clawHits = 0;
  crab.lastClaw = n0;
  const n = ++crab.clawHits;
  crab.anger = n;
  crab.angerT = 4000;
  if (n < 5) {
    say(T("poke")[n - 1]);
    setMode("wave", 500 + n * 150);
    sfx.click();
    return;
  }
  crab.clawHits = 0;
  crab.anger = 5;
  crab.angerT = 2600;
  setMode("wave", 1400);
  st.mood = Math.min(100, st.mood + 10);
  pinch = { x: p.x, y: p.y, t: 0 };

  say(T("pinch"), 2200);

    fl = document.getElementById("flash");
  w.classList.remove("shake");
  void w.offsetWidth;
  w.classList.add("shake");
  fl.classList.add("on");
  requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("on")));
}
function drawPinch(dt) {
  if (!pinch) return;
  pinch.t += dt;
  const t = pinch.t;
  if (t > 900) {
    pinch = null;
    return;
  }
  const k = 2,
    cx = Math.round(pinch.x),
    cy = Math.round(pinch.y);
  const gap = t < 90 ? 6 - t / 30 : 0;
  const a = t > 600 ? 1 - (t - 600) / 300 : 1;
  ctx.globalAlpha = a;
  const P = (x, y, w, h, c) => px(cx + x * k, cy + y * k, w * k, h * k, c);
  // upper jaw
  P(-7, -4 - gap, 12, 4, C.dark);
  P(-6, -4 - gap, 10, 3, C.shell);
  P(-4, -4 - gap, 4, 1, C.light);
  P(4, -1 - gap, 2, 1, C.dark);
  // lower jaw
  P(-7, 1 + gap, 9, 3, C.dark);
  P(-6, 1 + gap, 7, 2, C.shell);
  P(2, 1 + gap, 2, 1, C.dark);
  P(-10, -3 - gap / 2, 4, 6 + gap, C.dark);
  P(-9, -2 - gap / 2, 3, 4 + gap, C.shell);
  if (t > 80 && t < 500) {
    ctx.fillStyle = "#fff3c4";
    [
      [-1, -1],
      [1, -1],
      [1, 1],
      [-1, 1],
    ].forEach(([sx, sy]) => {
      for (let i = 0; i < 3; i++) px(cx + sx * (10 + i * 2), cy + sy * (5 + i), 2, 1, "#fff3c4");
    });

    <div><span>体重</span><button data-a="w-1">瘦</button><button data-a="w0">正常</button><button data-a="w1">胖</button></div>
    <div><span>成长</span><button data-a="lvl-">−</button><button data-a="lvl+">+</button><button data-a="xp">攒满经验</button></div>
    <div><span>天色</span><button data-a="skyA">自动</button><button data-a="sky1">白天</button><button data-a="sky0">夜晚</button></div>
    <div><span>季节</span><button data-a="seA">自动</button><button data-a="sespring">春</button><button data-a="sesummer">夏</button><button data-a="seautumn">秋</button><button data-a="sewinter">冬</button></div>
    <div><span>时间</span><button data-a="away1">离开 1 小时</button><button data-a="away8">离开 8 小时</button></div>
    <div><span>其他</span><button data-a="treasure">冒宝物</button><button data-a="ghost">变幽灵</button></div>
    <div><span>存档</span><button data-a="reset">清空存档</button></div>`;
  document.body.appendChild(box);
  const style = document.createElement("style");
  style.textContent = `#dbg{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;
    background:#1b1530;color:#fff;border-radius:14px;padding:10px 12px;font:13px/1.3 ui-monospace,monospace;display:grid;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
    #dbg div{display:flex;gap:4px;align-items:center}#dbg span{width:4em;color:#c9c0ee}
    #dbg button{font:inherit;color:#1b1530;background:#ffd166;border:0;border-radius:8px;padding:3px 8px;box-shadow:none;cursor:pointer}
    #dbg button.armed{background:#ff7a8a;color:#fff}`;
  document.head.appendChild(style);
  let armed = null;
  box.addEventListener("click", e => {
    const a = e.target.dataset && e.target.dataset.a;
    if (!a) return;
    if (a === "coins+") st.coins += 50;
    if (a === "coins0") st.coins = 0;
    if (a.startsWith("food")) st.food = +a.slice(4);
    if (a.startsWith("mood")) st.mood = +a.slice(4);
    if (a[0] === "w") st.weight = +a.slice(1);
    if (a === "lvl+") st.lvl = Math.min(4, st.lvl + 1);
    if (a === "lvl-") st.lvl = Math.max(0, st.lvl - 1);
    if (a === "xp" && st.lvl < 4) st.xp = NEED[st.lvl];
    if (a.startsWith("sky")) {
      skyOverride = a === "skyA" ? null : +a.slice(3);
      LT = targetL();
      syncLamp();
    }
    if (a.startsWith("se")) {
      seasonOverride = a === "seA" ? null : a.slice(2);
      ice.fill(season() === "winter" ? 1 : 0);
    }
    if (a.startsWith("away")) st.seen = Date.now() - +a.slice(4) * 3600e3;
    if (a === "treasure") treasureT = 0;
    if (a === "ghost" && !st.ghost) st.food = 0;
    if (a === "reset") {
      if (armed !== e.target) {
        armed = e.target;
        e.target.classList.add("armed");
        e.target.textContent = "再点一次";
        return;
      }
      try {
        localStorage.removeItem("crabpet");
      } catch (err) {}
      location.reload();
      return;
    }
    syncShop();
    save();
  });
}
if (location.hash === "#debug") debugPanel();
addEventListener("hashchange", () => {
  if (location.hash === "#debug") debugPanel();
});

})();
</script>
